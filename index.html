<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoreForge">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="CoreForge — a 6-week (repeatable to 12) abs, core and oblique training program. Baseline assessment on day one, then an auto-generated, week-to-week progressive program that self-saves your progress. Offline-ready, installs to your home screen.">
<title>CoreForge — 6-Week Abs & Core</title>
<style>
  :root{
    --bg:#0a0d12; --bg2:#0f141c; --card:#141a24; --card2:#1a222e; --line:#242e3c;
    --ink:#eef3f9; --muted:#8b98ab; --muted2:#65718400;
    --fire:#ff6a2b; --fire-d:#e04e12; --fire-l:#ff9d4d;
    --violet:#7c5cff; --violet-d:#5a3fd6;
    --teal:#12b5c9; --teal-d:#0c8fa0;
    --green:#22c55e; --green-d:#16a34a;
    --pink:#ff3b6b; --pink-d:#e01f52;
    --gold:#f5c451;
    --shadow:0 6px 24px rgba(0,0,0,.35);
    --shadow-lg:0 14px 44px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  button,input,select,textarea{font:inherit;color:inherit}
  button{touch-action:manipulation;cursor:pointer;border:none;background:none}
  .app{max-width:600px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);background-image:radial-gradient(1200px 380px at 50% -80px,rgba(255,106,43,.13),transparent 70%)}
  /* Top bar */
  .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(10,13,18,.96),rgba(10,13,18,.82));backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:34px;height:34px;border-radius:10px;flex:0 0 auto;background:linear-gradient(160deg,#ff9d4d,#ef4318);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(239,67,24,.4)}
  .logo svg{width:22px;height:22px;display:block}
  .brand-name{font-size:16px;font-weight:900;letter-spacing:.3px;line-height:1}
  .brand-sub{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-top:3px}
  .pill{font-size:11px;font-weight:800;padding:6px 11px;border-radius:20px;background:rgba(255,106,43,.14);border:1px solid rgba(255,106,43,.32);color:var(--fire-l);white-space:nowrap;text-align:right;line-height:1.25}
  .pill small{display:block;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.4px}
  main{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
  .view{display:none;animation:fade .25s ease}.view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2.vtitle{font-size:22px;margin:2px 2px 4px;font-weight:900;letter-spacing:.2px}
  .vsub{font-size:12.5px;color:var(--muted);margin:0 2px 16px}
  .section-label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:22px 3px 10px;display:flex;align-items:center;gap:8px}
  .section-label:before{content:"";width:4px;height:13px;border-radius:3px;background:var(--fire)}
  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .card.pad{padding:16px}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:850}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)}
  .tiny{font-size:11px}.sm{font-size:12.5px}
  .center{text-align:center}
  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:850;border-radius:13px;padding:14px 18px;font-size:15px;width:100%;transition:transform .08s,filter .15s;background:var(--card2);border:1px solid var(--line);color:var(--ink)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(135deg,var(--fire-l),var(--fire-d));color:#fff;border:none;box-shadow:0 8px 22px rgba(224,78,18,.36)}
  .btn.violet{background:linear-gradient(135deg,#9277ff,var(--violet-d));color:#fff;border:none}
  .btn.green{background:linear-gradient(135deg,#34d477,var(--green-d));color:#04220f;border:none}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .btn.sm{padding:10px 13px;font-size:13px;width:auto;border-radius:11px}
  .btn.block{margin-top:6px}
  .btn:disabled{opacity:.45;pointer-events:none}
  .btnrow{display:flex;gap:9px}.btnrow>*{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .chip.on{background:rgba(255,106,43,.16);border-color:var(--fire);color:var(--fire-l)}
  .tag{display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:8px}
  .tag.anterior{background:rgba(255,106,43,.18);color:var(--fire-l)}
  .tag.oblique{background:rgba(124,92,255,.18);color:#b3a1ff}
  .tag.lower{background:rgba(18,181,201,.18);color:#5fe0ef}
  .tag.stability{background:rgba(34,197,94,.16);color:#6ee7a0}
  .tag.dynamic{background:rgba(255,59,107,.18);color:#ff8aa8}
  /* Hero / session banner */
  .hero{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:16px}
  .hero.anterior{background:linear-gradient(135deg,#b83a10,#ff7e3a)}
  .hero.oblique{background:linear-gradient(135deg,#4a2fb0,#8f74ff)}
  .hero.lower{background:linear-gradient(135deg,#0a6b78,#1fc3d6)}
  .hero.dynamic{background:linear-gradient(135deg,#b01340,#ff5c81)}
  .hero.rest{background:linear-gradient(135deg,#1b2536,#33465f)}
  .hero .htop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .hero .hlbl{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.86}
  .hero h1{font-size:25px;font-weight:900;margin:5px 0 2px;letter-spacing:.3px}
  .hero .hmeta{font-size:12.5px;opacity:.92;font-weight:600}
  .hero .hicon{font-size:34px;line-height:1;opacity:.9}
  .hero .hstats{display:flex;gap:16px;margin-top:14px}
  .hero .hstat{font-size:11px;opacity:.85;font-weight:700}
  .hero .hstat b{display:block;font-size:19px;font-weight:900;opacity:1}
  /* Exercise item */
  .exlist{display:flex;flex-direction:column;gap:11px}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;transition:border-color .2s}
  .ex.done{border-color:rgba(34,197,94,.5)}
  .ex-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:13px 14px;align-items:center}
  .ex-check{width:30px;height:30px;border-radius:9px;border:2px solid #33415400;border-color:#334154;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:.15s}
  .ex-check svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:.15s}
  .ex.done .ex-check{background:var(--green);border-color:var(--green)}
  .ex.done .ex-check svg{opacity:1;transform:scale(1)}
  .ex-name{font-size:15px;font-weight:850;line-height:1.2}
  .ex.done .ex-name{color:var(--muted);text-decoration:line-through}
  .ex-region{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}
  .ex-rx{text-align:right;flex:0 0 auto}
  .ex-rx .big{font-size:15px;font-weight:900;color:var(--fire-l);white-space:nowrap}
  .ex-rx .sub{font-size:10px;color:var(--muted);margin-top:2px;font-weight:700}
  .ex-actions{display:flex;gap:7px;padding:0 14px 13px;flex-wrap:wrap}
  .ex-actions button{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-size:12px;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:5px}
  .ex-actions button.timer{color:var(--teal);border-color:rgba(18,181,201,.35)}
  .ex-actions button.info{color:var(--muted)}
  .setdots{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap}
  .setdot{flex:1;min-width:52px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
  .setdot.done{background:rgba(34,197,94,.16);border-color:var(--green);color:#6ee7a0}
  .setdot small{display:block;font-size:9px;font-weight:700;opacity:.8}
  /* Progress bars */
  .pbar{height:9px;border-radius:6px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
  .pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--fire-l),var(--fire));border-radius:6px;transition:width .4s}
  /* Stats grid */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
  .stat .n{font-size:26px;font-weight:900;line-height:1}
  .stat .l{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
  .ring{position:relative;width:104px;height:104px;margin:0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .rc b{font-size:28px;font-weight:900;line-height:1}
  .ring .rc span{font-size:9.5px;color:var(--muted);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  /* Callouts */
  .note{border-radius:13px;padding:13px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px}
  .note.info{background:rgba(18,181,201,.1);border:1px solid rgba(18,181,201,.28);color:#bfeef4}
  .note.fire{background:rgba(255,106,43,.1);border:1px solid rgba(255,106,43,.28);color:#ffd3b8}
  .note.warn{background:rgba(245,196,81,.1);border:1px solid rgba(245,196,81,.28);color:#f5e2b0}
  .note b{color:#fff}
  /* Inputs */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
  .field input,.field select{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-weight:700;color:var(--ink)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--fire)}
  .numrow{display:flex;align-items:center;gap:10px}
  .numrow button{width:48px;height:48px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);font-size:24px;font-weight:900;color:var(--fire-l);flex:0 0 auto}
  .numrow input{text-align:center;flex:1}
  .daypick{display:flex;gap:6px;flex-wrap:wrap}
  .daypick button{flex:1;min-width:38px;padding:11px 4px;border-radius:11px;background:var(--card2);border:1.5px solid var(--line);font-size:12px;font-weight:800;color:var(--muted)}
  .daypick button.on{background:var(--fire);border-color:var(--fire);color:#fff}
  /* Bottom nav */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(12,16,22,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;color:var(--muted);font-size:10px;font-weight:800;border-radius:12px}
  .nav button svg{width:23px;height:23px}
  .nav button.on{color:var(--fire-l)}
  .nav button.on svg{filter:drop-shadow(0 2px 6px rgba(255,106,43,.5))}
  /* Modal / sheet */
  .scrim{position:fixed;inset:0;z-index:60;background:rgba(4,6,10,.72);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
  .scrim.open{display:flex;animation:fade .2s}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:slideup .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  .sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 12px}
  .sheet h3{font-size:19px;font-weight:900;margin:2px 0 3px}
  .exphoto{width:100%;height:190px;object-fit:cover;border-radius:14px;background:var(--card2);display:block;margin-bottom:14px}
  .emblem{width:100%;height:150px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative;overflow:hidden}
  .steplist{counter-reset:s;margin:0;padding:0;list-style:none}
  .steplist li{position:relative;padding:9px 0 9px 40px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
  .steplist li:first-child{border-top:none}
  .steplist li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--fire-l);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
  .cuelist{list-style:none;padding:0;margin:6px 0 0}
  .cuelist li{padding:7px 0 7px 26px;position:relative;font-size:13px;line-height:1.5;border-top:1px dashed var(--line)}
  .cuelist li:first-child{border-top:none}
  .cuelist li:before{content:"";position:absolute;left:6px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--fire)}
  .cuelist.bad li:before{background:var(--pink)}
  /* Timer overlay */
  .timerbox{text-align:center;padding:10px 0 6px}
  .timerbox .tt{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .timerbox .tnum{font-size:72px;font-weight:900;line-height:1;letter-spacing:-2px;margin:8px 0;font-variant-numeric:tabular-nums}
  .timerbox .tnum.go{color:var(--green)}
  .timerbox .tnum.rest{color:var(--fire-l)}
  .timerring{position:relative;width:220px;height:220px;margin:0 auto}
  .timerring svg{transform:rotate(-90deg)}
  .timerring .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* Assessment */
  .assess-step{display:none}.assess-step.active{display:block}
  .measure-input{display:flex;gap:10px;align-items:stretch}
  .bignum{font-size:40px;font-weight:900;text-align:center;letter-spacing:-1px}
  .barmini{display:flex;align-items:flex-end;gap:5px;height:60px;margin-top:4px}
  .barmini > i{flex:1;background:linear-gradient(180deg,var(--fire-l),var(--fire-d));border-radius:4px 4px 0 0;min-height:4px;opacity:.9}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .cal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .calday{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;position:relative}
  .calday .wd{font-size:9.5px;color:var(--muted);font-weight:800;letter-spacing:.5px}
  .calday .ico{font-size:19px;margin:5px 0 3px}
  .calday .nm{font-size:10px;font-weight:800;line-height:1.15}
  .calday.done{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.07)}
  .calday.cur{border-color:var(--fire);box-shadow:0 0 0 2px rgba(255,106,43,.25)}
  .calday.rest{opacity:.55}
  .toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:12px 18px;border-radius:13px;font-size:13px;font-weight:800;box-shadow:var(--shadow-lg);z-index:80;opacity:0;pointer-events:none;transition:.28s;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .divider{height:1px;background:var(--line);margin:16px 0}
  a{color:var(--fire-l)}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .kv:first-child{border-top:none}.kv b{font-weight:800}
  .install-banner{background:linear-gradient(135deg,#1a222e,#141a24);border:1px solid var(--fire);border-radius:14px;padding:13px 14px;margin-bottom:14px;display:none;align-items:center;gap:12px}
  .install-banner.show{display:flex}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 30" fill="#fff"><rect x="3" y="1" width="7" height="4.4" rx="1.6"/><rect x="14" y="1" width="7" height="4.4" rx="1.6"/><rect x="3" y="7" width="7" height="4.4" rx="1.6"/><rect x="14" y="7" width="7" height="4.4" rx="1.6"/><rect x="4" y="13" width="6.5" height="4.4" rx="1.6"/><rect x="13.5" y="13" width="6.5" height="4.4" rx="1.6"/><path d="M10.7 19 L12 25 L12 19 Z"/><path d="M13.3 19 L12 25 L12 19 Z"/></svg>
      </div>
      <div>
        <div class="brand-name">CoreForge</div>
        <div class="brand-sub">Abs · Core · Obliques</div>
      </div>
    </div>
    <div class="pill" id="phasePill"><span id="pillMain">Day 1</span><small id="pillSub">Baseline</small></div>
  </div>

  <main>
    <!-- ===================== TODAY ===================== -->
    <section id="v-today" class="view active"></section>
    <!-- ===================== PROGRAM ===================== -->
    <section id="v-program" class="view"></section>
    <!-- ===================== PROGRESS ===================== -->
    <section id="v-progress" class="view"></section>
    <!-- ===================== GUIDE ===================== -->
    <section id="v-guide" class="view"></section>
  </main>

  <nav class="nav">
    <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v3M18 3v3M6 12l4 4 8-8"/><rect x="3" y="5" width="18" height="16" rx="3"/></svg>Today</button>
    <button data-tab="program"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Program</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
    <button data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 0-2 2z"/><path d="M19 3v18"/></svg>Guide</button>
  </nav>
</div>

<!-- Sheet / modal -->
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script id="state-data" type="application/json">{}</script>
<script>
"use strict";
/* =========================================================================
   CoreForge — 6-week (repeatable to 12) abs/core/oblique training PWA
   - Baseline assessment (day 1) -> Core Score + level + personal maxes
   - Auto-generated program, progressive overload week-to-week
   - Auto-regulating: adapts next week from how hard sessions felt
   - Re-assessment each 6-week block -> keeps scaling for 12 weeks
   - Self-saving: localStorage + IndexedDB mirror + persistent storage
   ========================================================================= */

/* ---------- tiny helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtTime=s=>{s=Math.round(s);const m=Math.floor(s/60);const r=s%60;return m>0?`${m}:${String(r).padStart(2,'0')}`:`${r}s`;};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2100);}
function haptic(ms=18){try{if(navigator.vibrate&&STATE.settings.vibrate)navigator.vibrate(ms);}catch(e){}}

/* ---- persistence: localStorage + IndexedDB mirror ---- */
let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('coreforge',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('kv');};r.onsuccess=e=>{idb=e.target.result;res(idb);};r.onerror=()=>res(null);}catch(e){res(null);}});}
function idbPut(k,v){try{if(!idb)return;const tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);}catch(e){}}
function idbGet(k){return new Promise(res=>{try{if(!idb)return res(null);const tx=idb.transaction('kv','readonly');const rq=tx.objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);}catch(e){res(null);}});}
let saveT=null;
function save(){
  STATE._saved=todayISO();
  const json=JSON.stringify(STATE);
  try{localStorage.setItem(STORE_KEY,json);}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(()=>idbPut(STORE_KEY,json),120);
}
async function load(){
  let json=null;
  try{json=localStorage.getItem(STORE_KEY);}catch(e){}
  if(!json){const mirror=await idbGet(STORE_KEY);if(mirror){json=mirror;try{localStorage.setItem(STORE_KEY,json);}catch(e){}toast('Progress restored from backup');}}

}

/* ============================ PROGRESSION ENGINE ============================ */
const SESSIONS_PER_WEEK=4, WEEKS_PER_CYCLE=6, SESSIONS_PER_CYCLE=SESSIONS_PER_WEEK*WEEKS_PER_CYCLE; // 24
const TOTAL_CYCLES=2; // two 6-week blocks = 12 weeks

function posOf(ptr){
  const cycle=Math.floor(ptr/SESSIONS_PER_CYCLE); // 0..2
  const inCycle=ptr%SESSIONS_PER_CYCLE;
  const week=Math.floor(inCycle/SESSIONS_PER_WEEK)+1; // 1..4
  const dayInWeek=inCycle%SESSIONS_PER_WEEK;          // 0..3
  return {cycle,inCycle,week,dayInWeek,session:SESSIONS[dayInWeek]};
}
function currentMaxes(cycle){
  // cycle 0 uses baseline; later cycles use reassessment if present, else baseline
  if(cycle>0 && STATE.reassess[cycle]) return STATE.reassess[cycle].maxes;
  return (STATE.baseline&&STATE.baseline.maxes)||{plank:40,side:25,hollow:25,lower:12,dyn:20};
}
function levelOf(cycle){
  if(cycle>0 && STATE.reassess[cycle]) return STATE.reassess[cycle].level;
  return (STATE.baseline&&STATE.baseline.level)||'Intermediate';
}
const LEVEL_TIER={Beginner:0,Intermediate:1,Advanced:2};
const LEVEL_FACTOR={Beginner:0.8,Intermediate:1.0,Advanced:1.2};

// choose which rung of a ladder based on cycle+week+level
function rungIndex(ladder,cycle,week,level){
  const arr=LADDERS[ladder];
  let idx=LEVEL_TIER[level]||1;         // base off fitness level
  idx+=cycle;                            // +1 rung each 6-week block
  if(week>=3) idx+=1;                     // mid-block progression
  if(week>=5) idx+=1;                     // peak-weeks progression (harder variations)
  // don't push optional/equipment rungs unless clearly earned
  idx=clamp(idx,0,arr.length-1);
  return idx;
}
// auto-regulation: adjust from how last week's sessions felt
function weekAdjust(cycle,week){
  if(week<=1) return 0;
  const key=cycle+'-'+(week-1);
  const feels=STATE.weekFeel[key]||[];
  if(!feels.length) return 0;
  let s=0;feels.forEach(f=>{s+=f==='easy'?1:(f==='hard'?-1:0);});
  const avg=s/feels.length;
  return clamp(Math.round(avg*2)/2*0.05,-0.08,0.08); // +/-8%
}

const TIME_FRAC=[0.50,0.58,0.66,0.74,0.82,0.90];   // % of tested max hold, by week (1-6)
const REP_FRAC =[0.55,0.64,0.73,0.82,0.91,1.00];   // % of tested max reps, by week (1-6)

function prescribe(exId,pos){
  const ex=EX[exId];const {cycle,week}=pos;
  const level=levelOf(cycle);
  const maxes=currentMaxes(cycle);
  const adj=weekAdjust(cycle,week);
  const cycleBoost=1+0.07*cycle;
  const adapt=(typeof STATE.adapt==='number')?STATE.adapt:1;  // grows as you improve, eases if too hard
  let sets=3;
  if(ex.region==='dynamic') sets=1;                 // finisher = 1 timed round
  if(ex.region==='stability') sets=2;               // warm-up/accessory
  if(week>=5 && ex.anchor && ex.region!=='stability') sets=4;   // peak weeks 5-6: extra set
  let target;
  if(ex.anchor && maxes[ex.anchor]){
    const frac=(ex.unit==='time'?TIME_FRAC:REP_FRAC)[week-1];
    target=maxes[ex.anchor]*frac*ex.hardness*(1+adj)*cycleBoost*adapt;
  }else{
    const base=(ex.unit==='time'?ex.base:ex.base);
    const wk=[1,1.08,1.16,1.25,1.34,1.44][week-1];
    target=base*(LEVEL_FACTOR[level]||1)*wk*(1+adj)*cycleBoost*adapt;
  }
  if(ex.unit==='time'){target=Math.round(target/5)*5;target=clamp(target,15,150);}
  else{target=Math.round(target);target=clamp(target,6,40);}
  return {sets,target,unit:ex.unit,rest:ex.rest||45};
}

// Build the full session object for a given pointer
function buildSession(ptr){
  const pos=posOf(ptr);
  const cycle=pos.cycle,week=pos.week,level=levelOf(cycle);
  const hasBar=STATE.profile.hasBar!==false; // default true; toggle in settings
  const main=pos.session.slots.map(ladder=>{
    let idx=rungIndex(ladder,cycle,week,level);
    let exId=LADDERS[ladder][idx];
    // swap out equipment moves the user can't do
    if(EX[exId].optional){
      if(exId==='kneeraise'&&!hasBar){exId='legraise';}
      if(exId==='copenhagen'&&STATE.profile.hasBench===false){exId='sidedip';}
    }
    return {exId,...prescribe(exId,pos),slot:ladder};
  });
  const finId=LADDERS[pos.session.finisher][clamp(rungIndex(pos.session.finisher,cycle,week,level),0,3)];
  const finisher={exId:finId,...prescribe(finId,pos),slot:pos.session.finisher};
  return {ptr,pos,cycle,week,session:pos.session,warmup:WARMUP,main,finisher,cooldown:COOLDOWN};
}
function sessionVolume(sess){
  let tut=0;const list=[...sess.main,sess.finisher];
  list.forEach(m=>{if(m.unit==='time')tut+=m.sets*m.target;else tut+=m.sets*m.target*3;});
  return {exercises:list.length,minutes:Math.round((tut+ list.reduce((a,m)=>a+m.sets*m.rest,0))/60)+3};
}

/* ============================ CORE SCORE ============================ */
function computeAssessment(results){
  let sum=0,n=0;
  TESTS.forEach(t=>{const v=+results[t.id]||0;sum+=clamp(v/t.bench*100,0,100);n++;});
  const score=Math.round(sum/n);
  const level=score<38?'Beginner':(score<68?'Intermediate':'Advanced');
  const maxes={plank:+results.plank||30,side:+results.side||20,hollow:+results.hollow||20,lower:+results.lower||10,dyn:+results.dyn||16};
  return {score,level,maxes};
}

/* ============================ SHEET ============================ */
// Opening a sheet pushes a history entry so Back closes the sheet (not the app).
// Re-calling openSheet while one is already open just swaps content (no new entry),
// so multi-step flows (assessment, timers) don't stack up history.
function openSheet(html){
  const s=$('#sheet');s.innerHTML='<div class="grab"></div>'+html;
  const already=$('#scrim').classList.contains('open');
  $('#scrim').classList.add('open');document.body.style.overflow='hidden';
  if(!already){try{history.pushState({cf:'sheet'},'');}catch(e){}}
}
function closeSheet(){
  const wasOpen=$('#scrim').classList.contains('open');
  $('#scrim').classList.remove('open');document.body.style.overflow='';stopTimer();
  // If the app (a button/scrim) closed the sheet, retire its history entry too,
  // so the counts stay balanced. The guard makes onPop ignore this self-pop.
  if(wasOpen&&history.state&&history.state.cf==='sheet'){
    _backGuard=true;try{history.back();}catch(e){_backGuard=false;}
  }
}
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet();});

/* ---- Android / browser Back-button integration ----
   Back: (1) close an open sheet, else (2) step back a tab, else
   (3) on the Today home tab, require a confirming second press to exit. */
let _backGuard=false,_exiting=false,_homeBackAt=0;
function onPop(e){
  if(_exiting)return;
  if(_backGuard){_backGuard=false;return;}
  if($('#scrim').classList.contains('open')){
    $('#scrim').classList.remove('open');document.body.style.overflow='';stopTimer();return;
  }
  const st=e.state||{};
  if(st.cf==='tab'){go(st.tab||'today');return;}
  if(st.cf==='home'){go('today');return;}
  // Reached the root: user is trying to leave from the home tab.
  const now=(typeof Date!=='undefined')?Date.now():0;
  if(now-_homeBackAt<2000){_exiting=true;try{history.back();}catch(e2){}return;}
  _homeBackAt=now;
  try{history.pushState({cf:'home',tab:'today'},'');}catch(e3){}
  if(TAB!=='today')go('today');
  toast('Press Back again to exit');
}
function initBackButton(){
  try{history.replaceState({cf:'root'},'');history.pushState({cf:'home',tab:'today'},'');}catch(e){}
  window.addEventListener('popstate',onPop);
}

function updatePill(){

  if(!STATE.onboarded){pm.textContent='Welcome';ps.textContent='Setup';return;}
  if(!STATE.baseline){pm.textContent='Day 1';ps.textContent='Baseline';return;}
  // check re-assessment gate
  const gate=reassessGate();
  if(gate){pm.textContent='Cycle '+(gate+1);ps.textContent='Re-test';return;}
  if(STATE.progressPtr>=SESSIONS_PER_CYCLE*TOTAL_CYCLES){pm.textContent='Complete';ps.textContent='12 weeks';return;}
  const pos=posOf(STATE.progressPtr);
  pm.textContent='Week '+((pos.cycle*WEEKS_PER_CYCLE)+pos.week);
  ps.textContent='Cycle '+(pos.cycle+1)+' · Wk '+pos.week;
}
// returns cycle index that needs a re-assessment before continuing, else 0/false
function reassessGate(){
  const ptr=STATE.progressPtr;
  if(ptr>0 && ptr%SESSIONS_PER_CYCLE===0){
    const cycle=ptr/SESSIONS_PER_CYCLE; // 1 or 2 (start of cycle 2 or 3)
    if(cycle<TOTAL_CYCLES && !STATE.reassess[cycle]) return cycle;
  }
  return 0;
}

  const log=ensureLog();const st=log.ex[exId]||{sets:[],done:false};
  st.sets=st.sets||[];st.sets[i]=!st.sets[i];
  const filled=st.sets.filter(Boolean).length;
  st.done=filled>=m.sets;
  if(st.done)recordPR(exId,m);
  log.ex[exId]=st;save();haptic(10);renderToday();
}
function recordPR(exId,m){
  const cur=STATE.prs[exId]||0;if(m.target>cur){STATE.prs[exId]=m.target;}
}
function finishSession(){
  const sess=buildSession(STATE.progressPtr);const total=sess.main.length+1;
  const log=ensureLog();const done=Object.values(log.ex).filter(x=>x.done).length;
  if(done<total){
    if(!confirm(`You've completed ${done}/${total} exercises. Mark the whole session done anyway?`))return;
  }
  // ask how it felt (auto-regulation)
  openSheet(`
    <h3>How did that feel?</h3>
    <p class="muted sm">This tunes next week's load automatically.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
      <button class="btn green" onclick="commitSession('easy')">😎 Easy — bring more</button>
      <button class="btn primary" onclick="commitSession('right')">💪 Challenging — just right</button>
      <button class="btn ghost" onclick="commitSession('hard')">🥵 Brutal — hold the load</button>
    </div>`);
}
function commitSession(feel){
  const p=STATE.progressPtr;const pos=posOf(p);const log=ensureLog();
  log.done=true;log.feel=feel;log.completedAt=todayISO();
  const key=pos.cycle+'-'+pos.week;(STATE.weekFeel[key]=STATE.weekFeel[key]||[]).push(feel);
  // Adaptive overload: every session nudges a persistent multiplier so targets
  // keep rising as you get stronger (and ease off only if it's genuinely brutal).
  const d=feel==='easy'?0.02:(feel==='hard'?-0.03:0.006);
  STATE.adapt=clamp((typeof STATE.adapt==='number'?STATE.adapt:1)+d,0.9,1.30);
  STATE.progressPtr=p+1;
  closeSheet();save();
  toast('Session logged · '+ (feel==='easy'?'load will rise':feel==='hard'?'load steady':'nice work'));
  // celebrate + move on
  const gate=reassessGate();
  if(gate){go('today');return;}
  go('today');
}

/* ---- Baseline test timer: Start -> 3·2·1 -> run -> Stop ----
   Timed holds count UP until you stop (elapsed seconds = your result).
   The 60s bicycle test counts DOWN and stops itself, then you enter reps. */
let _bt=null;
function stopBaselineTimer(){if(_bt){clearInterval(_bt.iv);_bt=null;}}
function coachSay(txt){try{if(typeof coachSpeak==='function')coachSpeak(txt);}catch(e){}}
function startBaselineTimer(){
  const t=TESTS[assessState.idx];const dur=t.dur||0; // dur>0 => count down; else count up
  stopBaselineTimer();try{if(typeof primeVoice==='function')primeVoice();}catch(e){}
  openSheet(baselineTimerHTML(t));
  _bt={iv:setInterval(tick,1000),mode:'ready',ready:3,elapsed:0,dur:dur,tid:t.id};
  paintReady();coachSay('Get ready.');
  function paintReady(){const b=$('#btBig');if(b){b.textContent=_bt.ready;b.className='tnum rest';}const l=$('#btLbl');if(l)l.textContent='GET READY';const h=$('#btHint');if(h)h.textContent='Get into position…';}
  function paintRun(){const b=$('#btBig');if(b){b.textContent=dur?fmtTime(Math.max(0,dur-_bt.elapsed)):fmtTime(_bt.elapsed);b.className='tnum go';}const l=$('#btLbl');if(l)l.textContent=dur?'TIME LEFT':'HOLD — ELAPSED';const h=$('#btHint');if(h)h.textContent=dur?'Go! Count every rep.':'Hold your best form. Tap Stop when you break.';const a=$('#btAction');if(a){a.style.display='block';a.textContent=dur?'■ Stop early':'■ Stop & save';}}
  function tick(){
    if(!_bt)return;
    if(_bt.mode==='ready'){
      _bt.ready--;
      if(_bt.ready>0){beep(660,.09);coachSay(String(_bt.ready));paintReady();}
      else{beep(990,.14);haptic(20);if(!motivate('start'))coachSay('Go!');_bt.mode='run';_bt.elapsed=0;paintRun();}
      return;
    }
    _bt.elapsed++;
    if(dur){
      const left=dur-_bt.elapsed;
      if(left===10){if(!motivate('push'))coachSay('Ten seconds left.');}
      else if(_bt.elapsed>0&&_bt.elapsed%10===0&&left>4)motivate('during');
      if(left<=3&&left>0)beep(660,.08);
      if(left<=0){beep(880,.28);haptic(30);if(!motivate('done'))coachSay('Time. Enter your reps.');stopBaselineTimer();backToAssessStep(false);return;}
    }else{
      // open-ended hold: push periodically the longer they hold
      if(_bt.elapsed>0&&_bt.elapsed%10===0)motivate('during');
    }
    paintRun();
  }
}
function baselineStop(){ // user tapped Stop
  const dur=_bt&&_bt.dur,elapsed=_bt?_bt.elapsed:0,running=_bt&&_bt.mode==='run';
  stopBaselineTimer();
  if(running&&!dur){const t=TESTS[assessState.idx];assessState.results[t.id]=elapsed;if(!motivate('done'))coachSay('Time. Strong hold.');}
  backToAssessStep(true);
}
function baselineCancel(){stopBaselineTimer();renderAssessStep();}
function backToAssessStep(focus){
  renderAssessStep();
  if(focus)setTimeout(()=>{const inp=$('#assess-val');if(inp){inp.focus();inp.select&&inp.select();}},160);
}
function baselineTimerHTML(t){
  return `
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="tiny muted">${t.name}</div><button class="chip" onclick="baselineCancel()">Cancel</button></div>
  <div class="timerbox" style="padding:22px 0 6px">
    <div class="tt" id="btLbl">GET READY</div>
    <div class="tnum rest" id="btBig" style="font-size:80px">3</div>
    <div class="tiny muted" id="btHint" style="margin-top:2px">Get into position…</div>
  </div>
  <button class="btn primary" id="btAction" onclick="baselineStop()" style="display:none">■ Stop &amp; save</button>`;
}
function assessNav(dir){
  const t=TESTS[assessState.idx];const v=parseFloat($('#assess-val').value);
  if(dir>0){if(!(v>=0)||$('#assess-val').value===''){toast('Enter your result (0 is fine)');return;}assessState.results[t.id]=v;}
  else{const cur=$('#assess-val').value;if(cur!=='')assessState.results[t.id]=parseFloat(cur);}
  const ni=assessState.idx+dir;
  if(ni<0)return;
  if(ni>=TESTS.length){finishAssessment();return;}
  assessState.idx=ni;renderAssessStep();
}
function finishAssessment(){
  const a=computeAssessment(assessState.results);
  const rec={date:todayISO(),results:assessState.results,score:a.score,level:a.level,maxes:a.maxes};
  if(assessState.reassess){STATE.reassess[assessState.reassess]=rec;}
  else{STATE.baseline=rec;}
  STATE.scoreHistory.push({date:todayISO(),score:a.score,level:a.level});
  save();
  // results screen
  openSheet(`
    <h3>${assessState.reassess?'Re-test complete':'Your Baseline'}</h3>
    <div class="center" style="margin:16px 0">${ringHTML(a.score,'Core Score')}</div>
    <div class="center" style="margin-bottom:16px"><span class="chip on" style="font-size:13px">Level: ${a.level}</span></div>
    ${scoreDeltaHTML(a)}
    <div class="card pad" style="margin-top:6px"><h3 style="font-size:14px">What this means</h3>
      <p class="sm muted">${levelBlurb(a.level)}</p>
      <p class="sm muted">Your program is now built from these numbers. Targets start sub-maximal for perfect form, then climb every week. You'll re-test after each 6-week block.</p>
    </div>
    <button class="btn primary" onclick="closeSheet();go('today')">${assessState.reassess?'Continue training →':'Start Week 1 →'}</button>
  `);
}
function scoreDeltaHTML(a){
  const hist=STATE.scoreHistory;
  if(hist.length<2)return '';
  const prev=hist[hist.length-2].score;const d=a.score-prev;
  if(d===0)return '';
  return `<div class="note ${d>0?'fire':'warn'}" style="text-align:center">${d>0?'▲ +'+d:'▼ '+d} points vs last test${d>0?' — your core is getting stronger 💪':''}</div>`;
}
function levelBlurb(l){
  if(l==='Beginner')return 'You\'re building your foundation — we\'ll master the core positions first, so every rep counts and nothing hurts your back.';
  if(l==='Intermediate')return 'Solid base of strength. The program will push volume and introduce harder variations to keep driving change.';
  return 'Strong core already. We\'ll use the toughest variations and high volume to force new adaptation.';
}

/* ============================ VOICE COACH ============================ */
/* Deep-voiced spoken coaching: pre-workout brief, timer callouts, exercise cues.
   Uses the Web Speech API with a low pitch (0.6) and a male/deep voice when the
   device exposes one. Automatic callouts obey the Voice-coach setting; manual
   buttons (brief / test / hear cues) always speak. */
let COACH_VOICES=[], COACH_V=null, _voicePrimed=false;
function loadCoachVoices(){
  try{COACH_VOICES=('speechSynthesis'in window)?speechSynthesis.getVoices():[];}catch(e){COACH_VOICES=[];}
  COACH_V=resolveVoice();
  // if the Guide/Settings tab is open, refresh so the picker fills in once the OS loads voices
  try{if($('#v-guide')&&$('#v-guide').classList.contains('active'))renderGuide();}catch(e){}
}
function resolveVoice(){
  if(!COACH_VOICES.length)return null;
  const want=STATE.settings.voiceName;
  if(want){const v=COACH_VOICES.find(x=>x.name===want);if(v)return v;}
  return pickDeepVoice();
}
function pickDeepVoice(){
  if(!COACH_VOICES.length)return null;
  const en=COACH_VOICES.filter(v=>/^en/i.test(v.lang));
  const pool=en.length?en:COACH_VOICES;
  // Prefer voices whose names read as deep / male
  const deep=['google uk english male','microsoft guy','microsoft david','microsoft mark','microsoft george','daniel','arthur','james','fred','aaron','albert','oliver','gordon','reed','rishi','deep','baritone','male'];
  for(const hint of deep){const v=pool.find(x=>x.name&&x.name.toLowerCase().includes(hint));if(v)return v;}
  // Otherwise skip obviously female-named voices
  const female=/female|samantha|victoria|karen|moira|tessa|fiona|serena|zira|susan|allison|ava|zoe|catherine|amelie|anna|nicky|kate|hazel|linda|heera|veena/i;
  return pool.find(x=>x.name&&!female.test(x.name))||pool[0];
}
function primeVoice(){
  if(_voicePrimed)return;_voicePrimed=true;
  try{loadCoachVoices();if('speechSynthesis'in window&&!COACH_VOICES.length){speechSynthesis.onvoiceschanged=loadCoachVoices;}}catch(e){}
}
function coachSpeak(text,force){
  try{
    if(!force&&STATE.settings.voice===false)return false;
    if(!('speechSynthesis'in window))return false;
    if(!COACH_VOICES.length)loadCoachVoices();
    const synth=speechSynthesis;synth.cancel();
    const u=new SpeechSynthesisUtterance(String(text||''));
    u.lang='en-US';u.volume=1;
    u.rate=(typeof STATE.settings.voiceRate==='number')?STATE.settings.voiceRate:0.98;
    u.pitch=(typeof STATE.settings.voicePitch==='number')?STATE.settings.voicePitch:0.6; // lower = deeper
    if(COACH_V)u.voice=COACH_V;
    synth.speak(u);return true;
  }catch(e){return false;}
}
function coachBrief(){
  primeVoice();
  const sess=buildSession(STATE.progressPtr);
  const wkNum=(sess.cycle*WEEKS_PER_CYCLE)+sess.week;
  const name=(STATE.profile.name||'').trim();
  const who=name?name+', ':'';
  const msg=`${who}welcome to week ${wkNum}. Today: ${sess.session.name}. ${sess.session.focus}. `+
    `${sess.main.length+1} exercises. Brace every rep, control the tempo, and own the burn. Let's get to work.`;
  coachSpeak(msg,true);
}
function speakExerciseCues(exId){
  const ex=EX[exId];if(!ex)return;primeVoice();
  coachSpeak(`${ex.name}. ${ex.cues.join('. ')}.`,true);
}
function testVoice(){primeVoice();coachSpeak("Core Forge voice coach, ready. Brace your core, and let's get to work.",true);}
function sampleVoice(){primeVoice();coachSpeak("Brace your core. Deep and steady. Let's work.",true);}
/* Voice-picker + depth/speed helpers */
function _ve(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function voiceOptionsHTML(){
  if(!COACH_VOICES.length)return '<option value="">Tap "Test voice" to load voices…</option>';
  const en=COACH_VOICES.filter(v=>/^en/i.test(v.lang));
  const list=en.length?en:COACH_VOICES;
  const sel=STATE.settings.voiceName||'';
  return '<option value="">Auto — deepest available</option>'+
    list.map(v=>`<option value="${_ve(v.name)}"${v.name===sel?' selected':''}>${_ve(v.name)} · ${_ve(v.lang)}</option>`).join('');
}
function setCoachVoice(name){STATE.settings.voiceName=name||'';COACH_V=resolveVoice();save();testVoice();}
function setCoachPitch(v){STATE.settings.voicePitch=Math.max(0,Math.min(2,parseFloat(v)||0.6));save();}
function setCoachRate(v){STATE.settings.voiceRate=Math.max(.5,Math.min(1.5,parseFloat(v)||0.98));save();}
function setRepTempo(v){STATE.settings.repTempo=Math.max(1,Math.min(6,parseFloat(v)||3));save();}

function currentPersona(){return COACHES.find(c=>c.id===STATE.settings.coach)||COACHES[0];}
let _lastHype={};
function pickVoiceByHint(hints){
  if(!COACH_VOICES||!COACH_VOICES.length)return COACH_V;
  const en=COACH_VOICES.filter(v=>/^en/i.test(v.lang));const pool=en.length?en:COACH_VOICES;
  for(const h of (hints||[])){const v=pool.find(x=>x.name&&x.name.toLowerCase().includes(h));if(v)return v;}
  return COACH_V||pool[0];
}
function hypeSpeak(text,persona){
  try{
    if(!('speechSynthesis'in window))return false;
    if(!COACH_VOICES.length)loadCoachVoices();
    const synth=speechSynthesis;synth.cancel();
    const u=new SpeechSynthesisUtterance(String(text||''));
    u.lang='en-US';u.volume=1;
    u.rate=persona.rate||1;u.pitch=(persona.pitch!=null)?persona.pitch:0.5;
    const v=pickVoiceByHint(persona.hint);if(v)u.voice=v;
    synth.speak(u);return true;
  }catch(e){return false;}
}
// Speak a random motivational line of the given kind (start|during|push|rest|done).
function motivate(kind,force){
  if(!force){
    if(STATE.settings.voice===false)return false;
    if(STATE.settings.hype===false)return false;
  }
  const p=currentPersona();const lines=p[kind]||p.during||[];
  if(!lines.length)return false;
  let i=Math.floor(Math.random()*lines.length);
  if(lines.length>1&&_lastHype[kind]===i)i=(i+1)%lines.length; // avoid immediate repeat
  _lastHype[kind]=i;
  try{if(typeof primeVoice==='function')primeVoice();}catch(e){}
  return hypeSpeak(lines[i],p);
}

let timer=null;
function stopTimer(){if(timer){clearInterval(timer.iv);timer=null;}if(typeof _bt!=='undefined'&&_bt){clearInterval(_bt.iv);_bt=null;}}
function beep(freq=880,dur=0.12){if(!STATE.settings.sound)return;try{const ac=beep._ac||(beep._ac=new (window.AudioContext||window.webkitAudioContext)());const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.start();o.stop(ac.currentTime+dur);}catch(e){}}
function openExerciseTimer(exId){
  const sess=buildSession(STATE.progressPtr);const m=[...sess.main,sess.finisher].find(x=>x.exId===exId);
  const ex=EX[exId];
  if(m.unit==='time'){runTimer('hold',m.target,ex.name,m.rest,()=>markSetFromTimer(exId));}
  else{runTimer('rest',m.rest,ex.name+' — rest',0,null);}
}
function runTimer(mode,seconds,label,restAfter,onDone,quiet){
  let remain=seconds;const total=seconds;
  const isHold=mode==='hold';
  openSheet(timerHTML(label,remain,isHold,total));
  primeVoice();
  if(!quiet){ if(isHold){ if(!motivate('start'))coachSpeak('Hold. Brace your core.'); } else { coachSpeak('Rest. '+seconds+' seconds.'); } }
  const numEl=()=>$('#tnum');const ringEl=()=>$('#tring');
  const C=2*Math.PI*100;
  function tick(){
    remain--;
    const el=total-remain;                         // seconds elapsed so far
    if(isHold){
      if(remain===10&&total>16){if(!motivate('push'))coachSpeak('Ten seconds. Hold strong.');}
      else if(el>0&&el%10===0&&remain>4)motivate('during');   // periodic push through the hold
    }else{
      if(remain===10&&total>13)coachSpeak('Ten seconds. Get ready.');
      else if(total>=24&&el===Math.round(total/2))motivate('rest');
    }
    if(remain===3)coachSpeak('Three. Two. One.');
    if(remain<=3&&remain>0)beep(660,.08);
    if(remain<=0){
      beep(isHold?990:880,.25);haptic(30);clearInterval(timer.iv);
      if(isHold&&restAfter>0){toast('Hold done! Resting '+restAfter+'s');if(!motivate('done'))coachSpeak('Time. Now rest.');setTimeout(()=>runTimer('rest',restAfter,label+' — rest',0,null,true),700);if(onDone)onDone();return;}
      if(onDone)onDone();
      if(!motivate('done'))coachSpeak(isHold?'Time. Strong hold.':'Rest over. Back to work.');
      $('#tnum')&&($('#tnum').textContent='Done');
      setTimeout(()=>closeSheet(),700);return;
    }
    update();
  }
  function update(){const n=$('#tnum');if(n){n.textContent=fmtTime(remain);}const r=$('#tring');if(r){r.style.strokeDashoffset=C*(1-remain/total);} }
  timer={iv:setInterval(tick,1000),mode};
  update();
}
function timerHTML(label,secs,isHold,total){
  const C=2*Math.PI*100;
  return `
  <div class="timerbox">
    <div class="tt">${label}</div>
    <div class="timerring">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="100" fill="none" stroke="var(--line)" stroke-width="12"/>
        <circle id="tring" cx="110" cy="110" r="100" fill="none" stroke="${isHold?'var(--green)':'var(--fire)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/>

    </div>
    <div class="btnrow" style="margin-top:20px">

function markSetFromTimer(exId){
  const sess=buildSession(STATE.progressPtr);const m=[...sess.main,sess.finisher].find(x=>x.exId===exId);
  const log=ensureLog();const st=log.ex[exId]||{sets:[],done:false};st.sets=st.sets||[];
  const i=st.sets.filter(Boolean).length;if(i<m.sets)st.sets[i]=true;
  st.done=st.sets.filter(Boolean).length>=m.sets;if(st.done)recordPR(exId,m);

}

/* ===== GUIDED REP CADENCE ===== */
/* Paces reps aloud at repTempo seconds each, then flows into the spoken
   between-sets rest timer. Reuses the `timer` global (mode 'reps'). */
let _repTok=0;
function startGuidedReps(exId){
  const sess=buildSession(STATE.progressPtr);const m=[...sess.main,sess.finisher].find(x=>x.exId===exId);
  const ex=EX[exId];
  runRepCadence(m.target,ex.name,m.rest,()=>markSetFromTimer(exId));
}
function cancelReps(){_repTok++;stopTimer();closeSheet();}
function runRepCadence(reps,label,restAfter,onDone){
  const total=Math.max(1,reps);let n=0;
  const tempo=Math.max(1.5,Math.min(6,(typeof STATE.settings.repTempo==='number')?STATE.settings.repTempo:3));
  const C=2*Math.PI*100;
  openSheet(repHTML(label,total));
  primeVoice();
  coachSpeak('Guided set. '+total+' reps. Here we go.');
  function paint(){const nn=$('#rcNum');if(nn)nn.textContent=n;const rr=$('#rcRing');if(rr)rr.style.strokeDashoffset=C*(1-n/total);}
  const half=Math.ceil(total/2);
  function step(){
    n++;
    beep(760,.06);haptic(14);
    if(total>=8&&n===half){if(!motivate('during'))coachSpeak(String(n));}   // mid-set push
    else coachSpeak(String(n));
    paint();
    if(n>=total){
      stopTimer();
      const tok=++_repTok,rest=restAfter,done=onDone,lbl=label;
      setTimeout(()=>{
        if(tok!==_repTok)return;               // cancelled or superseded
        if(!motivate('done'))coachSpeak('Set complete. Strong work.');
        if(done)done();
        if(rest>0)runTimer('rest',rest,lbl+' — rest',0,null);
        else{const nn=$('#rcNum');if(nn)nn.textContent='✓';setTimeout(closeSheet,700);}
      },Math.max(400,tempo*450));
    }
  }
  timer={iv:setInterval(step,tempo*1000),mode:'reps'};
  paint();
}
function repHTML(label,total){
  const C=2*Math.PI*100;
  return `
  <div class="timerbox">
    <div class="tt">${label}</div>
    <div class="timerring">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="100" fill="none" stroke="var(--line)" stroke-width="12"/>
        <circle id="rcRing" cx="110" cy="110" r="100" fill="none" stroke="var(--fire)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
      </svg>
      <div class="inner"><div class="tnum go" id="rcNum">0</div><div class="tt">OF ${total} REPS</div></div>
    </div>
    <div class="tiny muted" style="text-align:center;margin-top:6px">Do one rep on each call. It rests you between sets automatically.</div>

}

    h+=`</div>`;
  }
  h+=`<div class="note info" style="margin-top:16px"><b>How progression works:</b> Week 1 sets your baseline volumes. Weeks 2–6 raise reps &amp; hold times, unlock harder variations, and add a set in the peak weeks. The app also reads how each week <i>felt</i> and auto-adjusts. After 6 weeks you re-test, and everything scales up from your new numbers.</div>`;
  v.innerHTML=h;
}
function previewSession(ptr){
  if(ptr>SESSIONS_PER_CYCLE*TOTAL_CYCLES-1)return;
  const sess=buildSession(ptr);const vol=sessionVolume(sess);const wkNum=sess.cycle*WEEKS_PER_CYCLE+sess.week;
  openSheet(`
    <h3>${sess.session.name}</h3>
    <div class="tiny muted" style="margin-bottom:2px">Week ${wkNum} · ${sess.session.focus}</div>
    <div class="row" style="gap:8px;margin:10px 0 14px"><span class="chip">${sess.main.length+1} exercises</span><span class="chip">~${vol.minutes} min</span></div>
    <div class="section-label">Warm-up</div>
    <div class="card pad">${sess.warmup.map(id=>`<div class="kv"><span>${EX[id].name}</span><span class="muted">${EX[id].unit==='time'?'30s':'8/side'}</span></div>`).join('')}</div>
    <div class="section-label">Main work</div>
    <div class="card pad">${sess.main.map(m=>`<div class="kv"><span><b>${EX[m.exId].name}</b> <span class="tag ${EX[m.exId].region}" style="margin-left:4px">${EX[m.exId].region}</span></span><b>${m.sets}×${m.unit==='time'?fmtTime(m.target):m.target}</b></div>`).join('')}</div>
    <div class="section-label">Finisher</div>
    <div class="card pad"><div class="kv"><span><b>${EX[sess.finisher.exId].name}</b></span><b>${sess.finisher.sets}×${sess.finisher.unit==='time'?fmtTime(sess.finisher.target):sess.finisher.target}</b></div></div>
    ${ptr===STATE.progressPtr?`<button class="btn primary" onclick="closeSheet();go('today')">Go to this workout →</button>`:`<button class="btn ghost" onclick="closeSheet()">Close</button>`}

}

/* ============================ PROGRESS VIEW ============================ */
function renderProgress(){
  const v=$('#v-progress');
  const unit=STATE.profile.unit;
  let h=`<h2 class="vtitle">Progress</h2><div class="vsub">Everything auto-saved on this device.</div>`;
  // core score ring + level
  if(STATE.baseline){
    const latest=STATE.scoreHistory[STATE.scoreHistory.length-1];
    h+=`<div class="card pad center">${ringHTML(latest.score,'Core Score')}<div style="margin-top:10px"><span class="chip on">${latest.level}</span></div>
      ${STATE.scoreHistory.length>1?scoreTrendHTML():'<div class="tiny muted" style="margin-top:10px">Re-test after week 4 to see your climb.</div>'}</div>`;
  }
  // streak + counts
  const sessionsDone=Object.values(STATE.logs).filter(l=>l.done).length;
  const streak=computeStreak();
  const tut=totalTUT();
  h+=`<div class="grid3">
    <div class="stat"><div class="n" style="color:var(--fire-l)">${sessionsDone}</div><div class="l">Sessions</div></div>
    <div class="stat"><div class="n" style="color:var(--green)">${streak}</div><div class="l">Day streak</div></div>
    <div class="stat"><div class="n" style="color:var(--teal)">${tut}</div><div class="l">Min trained</div></div>
  </div>`;
  // waist / weight tracker
  h+=`<div class="section-label">Body measurements</div>`;
  h+=`<div class="card pad">
    <div class="row" style="justify-content:space-between"><b>Waist (${unit})</b><button class="btn sm primary" onclick="logMeasure()">+ Log today</button></div>
    ${measureChartHTML()}
  </div>`;
  // PRs
  h+=`<div class="section-label">Personal bests</div>`;
  const prKeys=Object.keys(STATE.prs);
  if(prKeys.length){
    h+=`<div class="card pad">${prKeys.map(k=>{const ex=EX[k];if(!ex)return'';return `<div class="kv"><span>${ex.name}</span><b>${ex.unit==='time'?fmtTime(STATE.prs[k]):STATE.prs[k]+' reps'}</b></div>`;}).join('')}</div>`;
  }else{h+=`<div class="note info">Complete workouts to bank personal bests here.</div>`;}
  // score history
  if(STATE.scoreHistory.length){
    h+=`<div class="section-label">Assessment history</div><div class="card pad">${STATE.scoreHistory.map((s,i)=>`<div class="kv"><span>${i===0?'Baseline':'Re-test '+i} · ${s.date}</span><b>${s.score}/100 · ${s.level}</b></div>`).join('')}</div>`;
  }
  v.innerHTML=h;
}
function ringHTML(score,label){
  const C=2*Math.PI*44;const off=C*(1-clamp(score,0,100)/100);
  const col=score<38?'#ff6a2b':score<68?'#f5c451':'#22c55e';
  return `<div class="ring"><svg width="104" height="104" viewBox="0 0 104 104">
    <circle cx="52" cy="52" r="44" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="52" cy="52" r="44" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
  </svg><div class="rc"><b>${score}</b><span>${label}</span></div></div>`;
}
function scoreTrendHTML(){
  const s=STATE.scoreHistory;const first=s[0].score,last=s[s.length-1].score;const d=last-first;
  return `<div class="tiny" style="margin-top:10px;color:${d>=0?'var(--green)':'var(--pink)'}">${d>=0?'▲ +'+d:'▼ '+d} points since baseline</div>`;
}
function measureChartHTML(){
  const ms=STATE.measurements.filter(m=>m.waist>0);
  if(ms.length<1)return `<div class="tiny muted" style="margin-top:10px">No measurements yet. Log your waist weekly — a shrinking waist is the clearest proof your core work is paying off.</div>`;
  const vals=ms.map(m=>m.waist);const mn=Math.min(...vals),mx=Math.max(...vals);const range=(mx-mn)||1;
  const first=ms[0].waist,last=ms[ms.length-1].waist;const change=(last-first);
  let bars=`<div class="barmini" style="margin-top:12px">`;
  ms.slice(-12).forEach(m=>{const hh=15+((mx-m.waist)/range)*85;bars+=`<i style="height:${hh}%" title="${m.date}: ${m.waist}"></i>`;});
  bars+=`</div>`;
  return `${bars}
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <span class="tiny muted">Start ${first}${STATE.profile.unit}</span>
      <span class="tiny" style="color:${change<=0?'var(--green)':'var(--muted)'};font-weight:800">${change<=0?'▼ ':'▲ +'}${Math.abs(change).toFixed(1)}${STATE.profile.unit}</span>
      <span class="tiny muted">Now ${last}${STATE.profile.unit}</span>
    </div>`;
}
function logMeasure(){
  openSheet(`
    <h3>Log today's measurements</h3>
    <div class="field"><label>Waist / navel (${STATE.profile.unit})</label>
      <div class="numrow"><button onclick="mBump('w',-0.5)">–</button><input id="m-waist" type="number" inputmode="decimal" placeholder="${STATE.measurements.length?STATE.measurements[STATE.measurements.length-1].waist:'86'}"><button onclick="mBump('w',0.5)">+</button></div></div>
    <div class="field"><label>Body weight (optional)</label>
      <div class="numrow"><button onclick="mBump('b',-0.5)">–</button><input id="m-weight" type="number" inputmode="decimal" placeholder="optional"><button onclick="mBump('b',0.5)">+</button></div></div>
    <button class="btn primary" onclick="saveMeasure()">Save</button>
  `);
}
function mBump(f,d){const id=f==='w'?'#m-waist':'#m-weight';const inp=$(id);inp.value=Math.max(0,((+inp.value||(+inp.placeholder||0))+d)).toFixed(1);}
function saveMeasure(){
  const w=parseFloat($('#m-waist').value);const b=parseFloat($('#m-weight').value);
  if(!(w>0)&&!(b>0)){toast('Enter at least one value');return;}
  const today=todayISO();const existing=STATE.measurements.find(m=>m.date===today);
  if(existing){if(w>0)existing.waist=w;if(b>0)existing.weight=b;}
  else STATE.measurements.push({date:today,waist:w>0?w:null,weight:b>0?b:null});
  if(w>0&&!STATE.profile.startWaist)STATE.profile.startWaist=w;
  save();closeSheet();toast('Measurement saved');renderProgress();
}
function computeStreak(){
  const dates=[...new Set(Object.values(STATE.logs).filter(l=>l.done&&l.completedAt).map(l=>l.completedAt))].sort();
  if(!dates.length)return 0;
  // streak = consecutive distinct training days ending at the most recent, allowing 1 rest day gap
  let streak=1;
  for(let i=dates.length-1;i>0;i--){
    const gap=(new Date(dates[i])-new Date(dates[i-1]))/86400000;
    if(gap<=3)streak++;else break;
  }
  return streak;
}
function totalTUT(){
  let mins=0;
  Object.keys(STATE.logs).forEach(p=>{const l=STATE.logs[p];if(l.done){const s=buildSession(+p);mins+=sessionVolume(s).minutes;}});
  return mins;
}

    <div class="row" style="justify-content:space-between;padding:6px 0"><span>Sound cues</span><button class="chip ${STATE.settings.sound?'on':''}" onclick="toggleSetting('sound')">${STATE.settings.sound?'On':'Off'}</button></div>
    <div class="row" style="justify-content:space-between;padding:6px 0"><span>Vibration</span><button class="chip ${STATE.settings.vibrate?'on':''}" onclick="toggleSetting('vibrate')">${STATE.settings.vibrate?'On':'Off'}</button></div>

    <div style="padding:6px 0 2px"><div class="tiny muted" style="margin-bottom:5px">Coach voice</div>
      <select onchange="setCoachVoice(this.value)" style="width:100%;padding:10px;border-radius:10px;background:#141b26;color:#e8eef7;border:1px solid var(--line);font-size:14px">${voiceOptionsHTML()}</select>
      <div class="tiny muted" style="margin-top:5px">Pick a specific voice, or leave on Auto to use the deepest one your phone has.</div>
    </div>
    <div style="padding:8px 0 2px">
      <div class="row" style="justify-content:space-between"><span class="tiny muted">Depth <span style="opacity:.7">(lower = deeper)</span></span><span class="tiny muted" id="pvLbl">${(typeof STATE.settings.voicePitch==='number'?STATE.settings.voicePitch:0.6).toFixed(2)}</span></div>
      <input type="range" min="0.3" max="1.2" step="0.05" value="${typeof STATE.settings.voicePitch==='number'?STATE.settings.voicePitch:0.6}" oninput="$('#pvLbl').textContent=(+this.value).toFixed(2)" onchange="setCoachPitch(this.value);sampleVoice()" style="width:100%">
    </div>
    <div style="padding:8px 0 2px">
      <div class="row" style="justify-content:space-between"><span class="tiny muted">Speed</span><span class="tiny muted" id="rvLbl">${(typeof STATE.settings.voiceRate==='number'?STATE.settings.voiceRate:0.98).toFixed(2)}×</span></div>
      <input type="range" min="0.7" max="1.3" step="0.05" value="${typeof STATE.settings.voiceRate==='number'?STATE.settings.voiceRate:0.98}" oninput="$('#rvLbl').textContent=(+this.value).toFixed(2)+'×'" onchange="setCoachRate(this.value);sampleVoice()" style="width:100%">
    </div>
    <div style="padding:8px 0 2px">
      <div class="row" style="justify-content:space-between"><span class="tiny muted">Rep cadence <span style="opacity:.7">(sec / rep)</span></span><span class="tiny muted" id="rtLbl">${(typeof STATE.settings.repTempo==='number'?STATE.settings.repTempo:3).toFixed(1)}s</span></div>
      <input type="range" min="1.5" max="5" step="0.5" value="${typeof STATE.settings.repTempo==='number'?STATE.settings.repTempo:3}" oninput="$('#rtLbl').textContent=(+this.value).toFixed(1)+'s'" onchange="setRepTempo(this.value)" style="width:100%">

    <div style="padding:6px 0 2px"><div class="tiny muted" style="margin-bottom:5px">Coach persona</div>
      <select onchange="setPersona(this.value)" style="width:100%;padding:10px;border-radius:10px;background:#141b26;color:#e8eef7;border:1px solid var(--line);font-size:14px">${personaOptionsHTML()}</select>
      <div class="row" style="justify-content:space-between;margin-top:6px"><span class="tiny muted">Drill sergeant, Marine, Navy, SWAT, Ultra, or a friendly Hype coach — they push you <b>during</b> the exercise, not just at the end.</span></div>

  </div>`;
  h+=`<div class="center tiny muted" style="margin:20px 0">CoreForge · built for a strong midsection<br>${STATE.profile.name?'Athlete: '+STATE.profile.name+' · ':''}saved ${STATE._saved||todayISO()}</div>`;
  v.innerHTML=h;
}
function toggleSetting(k){
  if(k==='hasBar')STATE.profile.hasBar=!(STATE.profile.hasBar!==false);
  else if(k==='hasBench')STATE.profile.hasBench=!(STATE.profile.hasBench!==false);
  else STATE.settings[k]=!STATE.settings[k];
  save();renderGuide();
}
function exportData(){
  const blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='coreforge-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.version){toast('Not a CoreForge backup');return;}STATE=Object.assign(DEFAULT_STATE(),p);save();toast('Backup restored');render();}catch(err){toast('Could not read file');}};
  r.readAsText(f);
}
function hardReset(){
  if(!confirm('Erase ALL your data and start over? This cannot be undone.'))return;
  if(!confirm('Are you absolutely sure? Consider exporting a backup first.'))return;
  STATE=DEFAULT_STATE();save();go('today');
}

/* ============================ INSTALL PROMPT ============================ */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstallHint();});
function showInstallHint(){
  if(document.getElementById('installBanner'))return;
  if(!$('#v-today'))return;
}

/* ============================ BOOT ============================ */
async function boot(){
  await idbOpen();
  await load();
  // voice coach defaults for existing installs that predate these settings
  if(STATE.settings.voice===undefined)STATE.settings.voice=true;
  if(STATE.settings.voiceName===undefined)STATE.settings.voiceName='';
  if(typeof STATE.settings.voicePitch!=='number')STATE.settings.voicePitch=0.6;
  if(typeof STATE.settings.voiceRate!=='number')STATE.settings.voiceRate=0.98;
  if(typeof STATE.settings.repTempo!=='number')STATE.settings.repTempo=3;
  if(typeof STATE.adapt!=='number')STATE.adapt=1;   // adaptive-overload multiplier
  if(STATE.settings.hype===undefined)STATE.settings.hype=true;   // motivator on by default
  if(!STATE.settings.coach)STATE.settings.coach='drill';         // default persona
  // request durable storage so an installed PWA keeps data
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  initBackButton();   // make the phone's Back button navigate instead of closing the app
  render();
  // voice coach: populate the voice list now and again when the OS finishes loading it,
  // and unlock speech on the first user interaction (mobile autoplay policy)
  try{loadCoachVoices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=loadCoachVoices;}catch(e){}
  document.addEventListener('pointerdown',primeVoice,{once:true,passive:true});
  // service worker
  if('serviceWorker'in navigator){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
}
window.addEventListener('load',boot);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){/* keep timers honest if needed */}});
</script>
