<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08090b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoreForge">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="CoreForge — a home training program that starts with 12 weeks of core, abs and HIIT for a flat stomach and no love handles, then expands into a full year of full-body strength (chest, back, shoulders, arms, legs) plus HIIT. Baseline assessment, week-to-week progression, self-saving. Offline-ready, installs to your home screen.">
<title>CoreForge — 6-Week Abs & Core</title>
<style>
  :root{
    --bg:#08090b; --bg2:#0f1218; --card:#101318; --card2:#171b22; --card3:#1f242d;
    --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
    --ink:#f2f5f9; --muted:#8b95a5; --dim:#5d6674; --muted2:#65718400;
    --fire:#ff5a1f; --fire-d:#e0450f; --fire-l:#ffa23d; --accInk:#140600; --accSoft:rgba(255,90,31,.13);
    --violet:#7c5cff; --violet-d:#5a3fd6;
    --teal:#12b5c9; --teal-d:#0c8fa0;
    --green:#3ddc84; --green-d:#1fae63;
    --pink:#ff3b6b; --pink-d:#e01f52;
    --gold:#f5c451;
    --font:"Archivo",-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --shadow-lg:0 24px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  button,input,select,textarea{font:inherit;color:inherit}
  button{touch-action:manipulation;cursor:pointer;border:none;background:none}
  .app{max-width:600px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);background-image:radial-gradient(520px 320px at 50% -120px,var(--accSoft),transparent 70%)}
  /* Top bar */
  .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(8,9,11,.96),rgba(8,9,11,.78));backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:34px;height:34px;border-radius:10px;flex:0 0 auto;background:linear-gradient(160deg,#ffa23d,#ff5a1f);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  .logo svg{width:22px;height:22px;display:block}
  .brand-name{font-size:16px;font-weight:900;letter-spacing:.3px;line-height:1}
  .brand-sub{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-top:3px}
  .pill{font-size:11px;font-weight:800;padding:6px 11px;border-radius:20px;background:var(--accSoft);border:1px solid rgba(255,90,31,.32);color:var(--fire-l);white-space:nowrap;text-align:right;line-height:1.25}
  .gearbtn{width:34px;height:34px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;flex:0 0 auto}
  .gearbtn:active{transform:scale(.94)}
  .pill small{display:block;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.4px}
  main{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
  .view{display:none;animation:fade .25s ease}.view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2.vtitle{font-size:22px;margin:2px 2px 4px;font-weight:900;letter-spacing:.2px}
  .vsub{font-size:12.5px;color:var(--muted);margin:0 2px 16px}
  .section-label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:22px 3px 10px;display:flex;align-items:center;gap:8px}
  .section-label:before{content:"";width:4px;height:13px;border-radius:3px;background:var(--fire)}
  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .card.pad{padding:16px}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:850}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)}
  .tiny{font-size:11px}.sm{font-size:12.5px}
  .center{text-align:center}
  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900;letter-spacing:.3px;border-radius:16px;padding:15px 18px;font-size:15px;width:100%;transition:transform .08s,filter .15s;background:var(--card2);border:1px solid var(--line);color:var(--ink)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(135deg,var(--fire-l),var(--fire));color:var(--accInk);border:none;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .btn.violet{background:linear-gradient(135deg,#9277ff,var(--violet-d));color:#fff;border:none}
  .btn.green{background:linear-gradient(135deg,#5ce89a,var(--green-d));color:#04220f;border:none}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .btn.sm{padding:10px 13px;font-size:13px;width:auto;border-radius:11px}
  .btn.block{margin-top:6px}
  .btn:disabled{opacity:.45;pointer-events:none}
  .btnrow{display:flex;gap:9px}.btnrow>*{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .chip.on{background:rgba(255,90,31,.16);border-color:var(--fire);color:var(--fire-l)}
  .tag{display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:8px}
  .tag.anterior{background:rgba(255,90,31,.18);color:var(--fire-l)}
  .tag.oblique{background:rgba(124,92,255,.18);color:#b3a1ff}
  .tag.lower{background:rgba(18,181,201,.18);color:#5fe0ef}
  .tag.stability{background:rgba(34,197,94,.16);color:#6ee7a0}
  .tag.dynamic{background:rgba(255,59,107,.18);color:#ff8aa8}
  .tag.strength{background:rgba(34,197,94,.16);color:#6ee7a0}
  .tag.cardio{background:rgba(245,196,81,.18);color:#f5d98a}
  .tag.chest{background:rgba(224,69,15,.18);color:#ff9d78}
  .tag.shoulders{background:rgba(224,161,31,.18);color:#f5d98a}
  .tag.back{background:rgba(18,181,201,.18);color:#5fe0ef}
  .tag.arms{background:rgba(124,92,255,.18);color:#b3a1ff}
  .tag.legs{background:rgba(34,197,94,.16);color:#6ee7a0}
  /* Photo hero (Today session card) */
  .herophoto{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-lg);margin-bottom:16px}
  .herophoto>img{width:100%;height:272px;object-fit:cover;display:block;filter:saturate(.9) contrast(1.03)}
  .herophoto .hp-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,11,.12) 0%,rgba(8,9,11,.5) 45%,rgba(8,9,11,.97) 100%)}
  .herophoto .hp-badges{position:absolute;top:14px;left:14px;display:flex;gap:6px;z-index:2}
  .hp-badge{font-size:10px;font-weight:800;letter-spacing:1px;padding:5px 9px;border-radius:8px;line-height:1}
  .hp-badge.today{background:var(--fire);color:var(--accInk)}
  .hp-badge.count{background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border:1px solid var(--line2);color:#fff}
  .herophoto .hp-body{position:absolute;left:0;right:0;bottom:0;padding:18px;z-index:2}
  .hp-focus{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--fire-l);text-transform:uppercase}
  .herophoto h1{font-size:26px;font-weight:900;margin:5px 0 2px;letter-spacing:.3px;color:#fff}
  .hp-stats{display:flex;gap:20px;margin-top:12px}
  .hp-stat{font-size:11px;color:rgba(255,255,255,.82);font-weight:700}
  .hp-stat b{display:block;font-size:19px;font-weight:900;color:#fff}
  /* Theme picker chips */
  .themerow{display:flex;gap:6px;padding:5px;background:var(--card2);border:1px solid var(--line);border-radius:999px;width:fit-content}
  .themechip{padding:8px 16px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--muted);transition:.18s}
  .themechip.on{background:var(--fire);color:var(--accInk)}
  /* Full-screen guided workout player */
  .pl{position:fixed;inset:0;z-index:75;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
  .pl.open{display:flex}
  .pl-bg{position:absolute;inset:0;background-size:cover;background-position:center top;opacity:.16;filter:saturate(.7)}
  .pl-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,11,.65),var(--bg) 74%)}
  .pl-head{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 6px}
  .pl-x{width:36px;height:36px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--ink);font-size:15px;display:grid;place-items:center}
  .pl-count{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--muted)}
  .pl-segs{position:relative;z-index:2;display:flex;gap:5px;padding:8px 16px 0}
  .pl-seg{flex:1;height:5px;border-radius:3px;background:var(--card2)}
  .pl-seg.done{background:var(--fire)}
  .pl-seg.cur{background:var(--fire-l)}
  .pl-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 22px calc(24px + env(safe-area-inset-bottom))}
  .pl-region{margin-bottom:6px}
  .pl-name{font-size:25px;font-weight:900;letter-spacing:.3px;line-height:1.12;margin-bottom:6px}
  .pl-ring{position:relative;width:232px;height:232px;margin:8px auto;display:grid;place-items:center}
  .pl-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .pl-pulse{position:absolute;width:184px;height:184px;border-radius:50%;background:var(--accSoft)}
  .pl-pulse.on{animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(.78);opacity:.28}50%{transform:scale(1.06);opacity:.6}}
  .pl-center{position:relative;text-align:center}
  .pl-num{font-size:64px;font-weight:900;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
  .pl-sub{font-size:12px;font-weight:800;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;margin-top:4px}
  .pl-set{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--fire-l);text-transform:uppercase;margin-top:4px}
  .pl-coach{font-size:14px;color:var(--muted);min-height:22px;margin-top:8px;max-width:320px}
  .pl-actions{display:flex;gap:10px;width:100%;max-width:440px;margin-top:18px}
  .pl-actions .btn{flex:1}
  .pl-next{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;width:100%;max-width:440px;margin-top:14px;text-align:left}
  .pl-next img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:var(--card2)}
  .pl-swap{margin-top:12px;font-size:12px;font-weight:800;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 15px}
  .pl-swapmenu{display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px;margin-top:10px}
  .pl-swapmenu button{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;color:var(--ink)}
  .pl-swapmenu button span{font-weight:700;color:var(--muted);font-size:12px}
  /* Hero / session banner */
  .hero{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:16px}
  .hero.anterior{background:linear-gradient(135deg,#b83a10,#ff7e3a)}
  .hero.oblique{background:linear-gradient(135deg,#4a2fb0,#8f74ff)}
  .hero.lower{background:linear-gradient(135deg,#0a6b78,#1fc3d6)}
  .hero.dynamic{background:linear-gradient(135deg,#b01340,#ff5c81)}
  .hero.rest{background:linear-gradient(135deg,#1b2536,#33465f)}
  .hero.fullbody{background:linear-gradient(135deg,#14663a,#2ec76f)}
  .hero.metcon{background:linear-gradient(135deg,#8a6d10,#f5c451)}
  .hero .htop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .hero .hlbl{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.86}
  .hero h1{font-size:25px;font-weight:900;margin:5px 0 2px;letter-spacing:.3px}
  .hero .hmeta{font-size:12.5px;opacity:.92;font-weight:600}
  .hero .hicon{font-size:34px;line-height:1;opacity:.9}
  .hero .hstats{display:flex;gap:16px;margin-top:14px}
  .hero .hstat{font-size:11px;opacity:.85;font-weight:700}
  .hero .hstat b{display:block;font-size:19px;font-weight:900;opacity:1}
  /* Exercise item */
  .exlist{display:flex;flex-direction:column;gap:11px}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:border-color .2s}
  .ex.done{border-color:rgba(34,197,94,.5)}
  .ex-top{display:grid;grid-template-columns:auto 48px 1fr auto;gap:12px;padding:13px 14px;align-items:center}
  .ex-thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;display:block;background:var(--card2);border:1px solid var(--line)}
  .ex-check{width:30px;height:30px;border-radius:9px;border:2px solid #33415400;border-color:#334154;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:.15s}
  .ex-check svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:.15s}
  .ex.done .ex-check{background:var(--green);border-color:var(--green)}
  .ex.done .ex-check svg{opacity:1;transform:scale(1)}
  .ex-name{font-size:15px;font-weight:850;line-height:1.2}
  .ex.done .ex-name{color:var(--muted);text-decoration:line-through}
  .ex-region{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}
  .ex-rx{text-align:right;flex:0 0 auto}
  .ex-rx .big{font-size:15px;font-weight:900;color:var(--fire-l);white-space:nowrap}
  .ex-rx .sub{font-size:10px;color:var(--muted);margin-top:2px;font-weight:700}
  .ex-actions{display:flex;gap:7px;padding:0 14px 13px;flex-wrap:wrap}
  .ex-actions button{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-size:12px;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:5px}
  .ex-actions button.timer{color:var(--teal);border-color:rgba(18,181,201,.35)}
  .ex-actions button.info{color:var(--muted)}
  .setdots{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap}
  .setdot{flex:1;min-width:52px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
  .setdot.done{background:rgba(34,197,94,.16);border-color:var(--green);color:#6ee7a0}
  .setdot small{display:block;font-size:9px;font-weight:700;opacity:.8}
  /* Progress bars */
  .pbar{height:9px;border-radius:6px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
  .pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--fire-l),var(--fire));border-radius:6px;transition:width .4s}
  .pbar.green > i{background:linear-gradient(90deg,#5ce89a,var(--green))}
  .hmgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
  .hm{aspect-ratio:1;border-radius:5px;background:var(--card2);border:1px solid var(--line)}
  .hm.on{background:var(--fire);border-color:var(--fire)}
  .hm.rest{background:rgba(255,255,255,.10)}
  /* Stats grid */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
  .stat .n{font-size:26px;font-weight:900;line-height:1}
  .stat .l{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
  .ring{position:relative;width:104px;height:104px;margin:0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .rc b{font-size:28px;font-weight:900;line-height:1}
  .ring .rc span{font-size:9.5px;color:var(--muted);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  /* Callouts */
  .note{border-radius:13px;padding:13px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px}
  .note.info{background:rgba(18,181,201,.1);border:1px solid rgba(18,181,201,.28);color:#bfeef4}
  .note.fire{background:rgba(255,90,31,.1);border:1px solid rgba(255,90,31,.28);color:#ffd3b8}
  .note.warn{background:rgba(245,196,81,.1);border:1px solid rgba(245,196,81,.28);color:#f5e2b0}
  .note b{color:#fff}
  /* Inputs */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
  .field input,.field select{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-weight:700;color:var(--ink)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--fire)}
  .numrow{display:flex;align-items:center;gap:10px}
  .numrow button{width:48px;height:48px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);font-size:24px;font-weight:900;color:var(--fire-l);flex:0 0 auto}
  .numrow input{text-align:center;flex:1}
  .daypick{display:flex;gap:6px;flex-wrap:wrap}
  .daypick button{flex:1;min-width:38px;padding:11px 4px;border-radius:11px;background:var(--card2);border:1.5px solid var(--line);font-size:12px;font-weight:800;color:var(--muted)}
  .daypick button.on{background:var(--fire);border-color:var(--fire);color:var(--accInk)}
  /* Bottom nav */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(8,9,11,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;color:var(--muted);font-size:10px;font-weight:800;border-radius:12px}
  .nav button svg{width:23px;height:23px}
  .nav button.on{color:var(--fire-l)}
  .nav button.on svg{filter:drop-shadow(0 2px 6px rgba(255,90,31,.5))}
  /* Modal / sheet */
  .scrim{position:fixed;inset:0;z-index:60;background:rgba(4,6,10,.72);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
  .scrim.open{display:flex;animation:fade .2s}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:slideup .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  .sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 12px}
  .sheet h3{font-size:19px;font-weight:900;margin:2px 0 3px}
  .exphoto{width:100%;height:190px;object-fit:cover;border-radius:14px;background:var(--card2);display:block;margin-bottom:14px}
  .emblem{width:100%;height:150px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative;overflow:hidden}

<script>
"use strict";
/* =========================================================================
   CoreForge — 6-week (repeatable to 12) abs/core/oblique training PWA
   - Baseline assessment (day 1) -> Core Score + level + personal maxes
   - Auto-generated program, progressive overload week-to-week
   - Auto-regulating: adapts next week from how hard sessions felt
   - Re-assessment each 6-week block -> keeps scaling for 12 weeks
   - Self-saving: localStorage + IndexedDB mirror + persistent storage
   ========================================================================= */

/* ---------- tiny helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtTime=s=>{s=Math.round(s);const m=Math.floor(s/60);const r=s%60;return m>0?`${m}:${String(r).padStart(2,'0')}`:`${r}s`;};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2100);}
function haptic(ms=18){try{if(navigator.vibrate&&STATE.settings.vibrate)navigator.vibrate(ms);}catch(e){}}

/* ============================ EXERCISE LIBRARY ============================
   region: anterior|oblique|lower|stability|dynamic
   unit: 'time' (seconds) | 'reps'
   img: filename or null (null => generated emblem)
   anchor: which baseline metric personalizes it (plank|side|hollow|lower|dyn)
   hardness: multiplier vs the anchor baseline (harder rung => <1)
   base: fallback week-1 target (used when not anchored / level-scaled)
========================================================================== */
const EX = {
  /* -- anti-extension / plank ladder -- */
  kneeplank:{name:'Knee Plank',region:'anterior',unit:'time',img:'ex-kneeplank.jpg',anchor:'plank',hardness:1.5,base:30,rest:45,
    why:'The safest entry to anti-extension core bracing — builds the deep transverse abdominis that flattens the waist.',
    steps:['Kneel on all fours, then drop to your forearms with elbows under shoulders.','Walk knees back so your body forms a straight line from head to knees.','Brace your abs as if about to be punched; tuck the ribs down.','Squeeze glutes and hold — do not let the hips sag.'],
    cues:['Elbows directly under shoulders','Ribs down, belt-line pulled in','Neutral neck — look at the floor'],
    mistakes:['Hips sagging toward the floor','Butt piked up in the air','Holding your breath — breathe steadily']},
  plank:{name:'Forearm Plank',region:'anterior',unit:'time',img:'ex-plank.jpg',anchor:'plank',hardness:1.0,base:40,rest:50,
    why:'The most proven anti-extension core hold. Trains the entire rectus + deep core to resist gravity, building a rock-solid midsection.',
    steps:['Set forearms on the floor, elbows under shoulders, feet hip-width.','Lift into a straight line — heels, hips, shoulders, head aligned.','Brace abs hard, tuck ribs down, squeeze glutes and quads.','Hold the line, breathing shallow and steady.'],
    cues:['Straight line head-to-heel','Push the floor away — active shoulders','Glutes + quads switched on'],
    mistakes:['Sagging or piking hips','Shrugging shoulders to the ears','Letting the lower back arch']},
  longplank:{name:'Long-Lever Plank',region:'anterior',unit:'time',img:'ex-longplank.jpg',anchor:'plank',hardness:0.7,base:30,rest:60,
    why:'Walking the elbows forward dramatically increases the load on the abs — a big overload jump without any equipment.',
    steps:['Start in a forearm plank.','Walk your elbows forward, a few inches ahead of your shoulders.','Brace even harder — the further forward, the tougher.','Hold the straight line without letting the hips drop.'],
    cues:['Only go as far forward as you can stay rigid','Ribs stapled down','Push elbows into the floor'],
    mistakes:['Lower back caving as you extend','Reaching too far, too soon']},
  planktap:{name:'Plank Shoulder Taps',region:'anterior',unit:'reps',img:'ex-planktap.jpg',anchor:'plank',hardness:0.55,base:16,rest:55,
    why:'Adds an anti-rotation demand to the plank — your abs and obliques fight to keep your hips level as you lift each hand.',
    steps:['Set up in a high plank on your hands, feet slightly wider than hips.','Brace the core and squeeze glutes to lock the torso still.','Lift one hand and tap the opposite shoulder.','Return and repeat other side — keep hips dead level. Count both taps as reps.'],
    cues:['Hips do NOT rock side to side','Feet wider = more stable','Slow and controlled'],

  /* -- rectus static / hollow ladder -- */

    steps:['Lie on your back, pull knees toward chest, lift shoulder blades off the floor.','Press your lower back flat into the ground — no gap.','Reach hands toward your knees, chin slightly tucked.','Hold this hollow "banana" shape, keeping the low back pinned.'],
    cues:['Lower back GLUED to the floor','Shoulder blades off the ground','Constant abdominal tension'],
    mistakes:['Lower back arching up (gap under it)','Neck straining — keep it long']},
  hollow:{name:'Hollow Body Hold',region:'anterior',unit:'time',img:'ex-hollow.jpg',anchor:'hollow',hardness:1.0,base:25,rest:55,
    why:'One of the single best rectus-abdominis exercises measured — full-body tension that carves a strong, controlled midsection.',

  /* -- lower abs ladder -- */
  deadbug:{name:'Dead Bug',region:'stability',unit:'reps',img:'ex-deadbug.jpg',anchor:'lower',hardness:1.4,base:16,rest:40,

  revcrunch:{name:'Reverse Crunch',region:'lower',unit:'reps',img:'ex-revcrunch.jpg',anchor:'lower',hardness:1.0,base:14,rest:45,

  crunch:{name:'Controlled Crunch',region:'anterior',unit:'reps',img:'ex-crunch.jpg',anchor:null,hardness:1.4,base:18,rest:35,

  bicycle:{name:'Bicycle Crunch',region:'oblique',unit:'time',img:'ex-bicycle.jpg',anchor:null,hardness:1.0,base:40,rest:40,

  seatedtwist:{name:'Seated Twist',region:'oblique',unit:'reps',img:'ex-seatedtwist.jpg',anchor:null,hardness:1.3,base:20,rest:35,

/* ============================ PROGRESSION ENGINE ============================ */
const SESSIONS_PER_WEEK=4, WEEKS_PER_CYCLE=6, SESSIONS_PER_CYCLE=SESSIONS_PER_WEEK*WEEKS_PER_CYCLE; // 24
const PHASE1_CYCLES=2;   // blocks 1–2 = weeks 1–12: core/abs/HIIT (unchanged)
const TOTAL_CYCLES=8;    // 8 six-week blocks = 48 weeks (~1 year): Phase 1 then full-body split
function phaseOf(cycle){return cycle<PHASE1_CYCLES?1:2;}
function sessionsFor(cycle){return phaseOf(cycle)===1?SESSIONS:PHASE2_SESSIONS;}

function posOf(ptr){
  const cycle=Math.floor(ptr/SESSIONS_PER_CYCLE); // 0..2
  const inCycle=ptr%SESSIONS_PER_CYCLE;
  const week=Math.floor(inCycle/SESSIONS_PER_WEEK)+1; // 1..4
  const dayInWeek=inCycle%SESSIONS_PER_WEEK;          // 0..3
  return {cycle,inCycle,week,dayInWeek,phase:phaseOf(cycle),session:sessionsFor(cycle)[dayInWeek]};
}
function currentMaxes(cycle){
  // cycle 0 uses baseline; later cycles use reassessment if present, else baseline
  if(cycle>0 && STATE.reassess[cycle] && STATE.reassess[cycle].maxes) return STATE.reassess[cycle].maxes;
  return (STATE.baseline&&STATE.baseline.maxes)||{plank:40,side:25,hollow:25,lower:12,dyn:20};
}
function levelOf(cycle){
  if(cycle>0 && STATE.reassess[cycle]) return STATE.reassess[cycle].level;
  return (STATE.baseline&&STATE.baseline.level)||'Intermediate';
}
const LEVEL_TIER={Beginner:0,Intermediate:1,Advanced:2};
const LEVEL_FACTOR={Beginner:0.8,Intermediate:1.0,Advanced:1.2};
// Phase-2 ladders start fresh at week 13, so they progress off the phase-relative
// block count (not the absolute cycle) — otherwise they'd open at their hardest rung.
const PHASE2_LADDERS={chestL:1,shoulderL:1,pullL:1,rowL:1,tricepL:1,bicepL:1,squatL:1,hingeL:1,calfL:1,legPowerL:1};

// choose which rung of a ladder based on cycle+week+level
function rungIndex(ladder,cycle,week,level){
  const arr=LADDERS[ladder];
  const eff=PHASE2_LADDERS[ladder]?Math.max(0,cycle-PHASE1_CYCLES):cycle;  // phase-relative for new splits
  let idx=LEVEL_TIER[level]||1;         // base off fitness level
  idx+=eff;                              // +1 rung each block (within the ladder's phase)
  if(week>=3) idx+=1;                     // mid-block progression
  if(week>=5) idx+=1;                     // peak-weeks progression (harder variations)
  // don't push optional/equipment rungs unless clearly earned
  idx=clamp(idx,0,arr.length-1);
  return idx;
}
// auto-regulation: adjust from how last week's sessions felt
function weekAdjust(cycle,week){
  if(week<=1) return 0;
  const key=cycle+'-'+(week-1);
  const feels=STATE.weekFeel[key]||[];
  if(!feels.length) return 0;
  let s=0;feels.forEach(f=>{s+=f==='easy'?1:(f==='hard'?-1:0);});
  const avg=s/feels.length;
  return clamp(Math.round(avg*2)/2*0.05,-0.08,0.08); // +/-8%
}

const TIME_FRAC=[0.50,0.58,0.66,0.74,0.82,0.90];   // % of tested max hold, by week (1-6)
const REP_FRAC =[0.55,0.64,0.73,0.82,0.91,1.00];   // % of tested max reps, by week (1-6)

function prescribe(exId,pos){
  const ex=EX[exId];const {cycle,week}=pos;
  const level=levelOf(cycle);
  const maxes=currentMaxes(cycle);
  const adj=weekAdjust(cycle,week);
  const cycleBoost=1+0.05*Math.min(cycle,5);        // capped so ~1 year of blocks doesn't run away
  const adapt=(typeof STATE.adapt==='number')?STATE.adapt:1;  // grows as you improve, eases if too hard
  const STRENGTH_REGIONS={chest:1,back:1,shoulders:1,arms:1,legs:1,strength:1};
  let sets=3;
  if(ex.region==='dynamic') sets=1;                 // finisher = 1 timed round
  if(ex.region==='stability') sets=2;               // warm-up/accessory
  if(week>=5 && (ex.anchor||STRENGTH_REGIONS[ex.region]) && ex.region!=='stability') sets=4;   // peak weeks 5-6: extra set
  let target;
  if(ex.anchor && maxes[ex.anchor]){
    const frac=(ex.unit==='time'?TIME_FRAC:REP_FRAC)[week-1];
    target=maxes[ex.anchor]*frac*ex.hardness*(1+adj)*cycleBoost*adapt;
  }else{
    const base=(ex.unit==='time'?ex.base:ex.base);
    const wk=[1,1.08,1.16,1.25,1.34,1.44][week-1];
    target=base*(LEVEL_FACTOR[level]||1)*wk*(1+adj)*cycleBoost*adapt;
  }
  if(ex.unit==='time'){target=Math.round(target/5)*5;target=clamp(target,15,150);}
  else{target=Math.round(target);target=clamp(target,6,40);}
  return {sets,target,unit:ex.unit,rest:ex.rest||45};
}

// Build the full session object for a given pointer
function buildSession(ptr){
  const pos=posOf(ptr);
  const cycle=pos.cycle,week=pos.week,level=levelOf(cycle);
  const hasBar=STATE.profile.hasBar!==false; // default true; toggle in settings
  const main=pos.session.slots.map(ladder=>{
    let idx=rungIndex(ladder,cycle,week,level);
    let exId=LADDERS[ladder][idx];
    // swap out equipment moves the user can't do
    if(EX[exId].optional){
      if(exId==='kneeraise'&&!hasBar){exId='legraise';}
      if(exId==='copenhagen'&&STATE.profile.hasBench===false){exId='sidedip';}
    }
    return {exId,...prescribe(exId,pos),slot:ladder};
  });
  const finLad=LADDERS[pos.session.finisher];
  const finId=finLad[clamp(rungIndex(pos.session.finisher,cycle,week,level),0,finLad.length-1)];
  const finisher={exId:finId,...prescribe(finId,pos),slot:pos.session.finisher};
  finisher.sets=1;   // a finisher is always one all-out burnout round
  return {ptr,pos,cycle,week,session:pos.session,warmup:WARMUP,main,finisher,cooldown:COOLDOWN};
}
function sessionVolume(sess){
  let tut=0;const list=[...sess.main,sess.finisher];
  list.forEach(m=>{if(m.unit==='time')tut+=m.sets*m.target;else tut+=m.sets*m.target*3;});
  return {exercises:list.length,minutes:Math.round((tut+ list.reduce((a,m)=>a+m.sets*m.rest,0))/60)+3};
}

/* ============================ CORE SCORE ============================ */
function computeAssessment(results){
  let sum=0,n=0;
  TESTS.forEach(t=>{const v=+results[t.id]||0;sum+=clamp(v/t.bench*100,0,100);n++;});
  const score=Math.round(sum/n);
  const level=score<38?'Beginner':(score<68?'Intermediate':'Advanced');
  const maxes={plank:+results.plank||30,side:+results.side||20,hollow:+results.hollow||20,lower:+results.lower||10,dyn:+results.dyn||16};
  return {score,level,maxes};
}

// Opening a sheet pushes a history entry so Back closes the sheet (not the app).
// Re-calling openSheet while one is already open just swaps content (no new entry),
// so multi-step flows (assessment, timers) don't stack up history.
function openSheet(html){
  const s=$('#sheet');s.innerHTML='<div class="grab"></div>'+html;
  const already=$('#scrim').classList.contains('open');
  $('#scrim').classList.add('open');document.body.style.overflow='hidden';
  if(!already){try{history.pushState({cf:'sheet'},'');}catch(e){}}
}
function closeSheet(){
  const wasOpen=$('#scrim').classList.contains('open');
  $('#scrim').classList.remove('open');document.body.style.overflow='';stopTimer();beatStop();
  // If the app (a button/scrim) closed the sheet, retire its history entry too,
  // so the counts stay balanced. The guard makes onPop ignore this self-pop.
  if(wasOpen&&history.state&&history.state.cf==='sheet'){
    _backGuard=true;try{history.back();}catch(e){_backGuard=false;}
  }
}

/* ---- Android / browser Back-button integration ----
   Back: (1) close an open sheet, else (2) step back a tab, else
   (3) on the Today home tab, require a confirming second press to exit. */
let _backGuard=false,_exiting=false,_homeBackAt=0;
function onPop(e){
  if(_exiting)return;
  if(_backGuard){_backGuard=false;return;}
  if(typeof INTV!=='undefined'&&INTV){hiitTeardown();return;}
  if(typeof PLAYER!=='undefined'&&PLAYER){playerTeardown();return;}
  if($('#scrim').classList.contains('open')){
    $('#scrim').classList.remove('open');document.body.style.overflow='';stopTimer();return;
  }
  const st=e.state||{};
  if(st.cf==='tab'){go(st.tab||'today');return;}
  if(st.cf==='home'){go('today');return;}
  // Reached the root: user is trying to leave from the home tab.
  const now=(typeof Date!=='undefined')?Date.now():0;
  if(now-_homeBackAt<2000){_exiting=true;try{history.back();}catch(e2){}return;}
  _homeBackAt=now;
  try{history.pushState({cf:'home',tab:'today'},'');}catch(e3){}
  if(TAB!=='today')go('today');
  toast('Press Back again to exit');
}
function initBackButton(){
  try{history.replaceState({cf:'root'},'');history.pushState({cf:'home',tab:'today'},'');}catch(e){}
  window.addEventListener('popstate',onPop);
}

function render(){
  updatePill();
  if(TAB==='today')renderToday();
  else if(TAB==='program')renderProgram();
  else if(TAB==='fuel')renderFuel();
  else if(TAB==='quick')renderQuick();
  else if(TAB==='progress')renderProgress();
  else if(TAB==='guide')renderGuide();
}
function updatePill(){
  const pm=$('#pillMain'),ps=$('#pillSub');
  if(!STATE.onboarded){pm.textContent='Welcome';ps.textContent='Setup';return;}
  if(!STATE.baseline){pm.textContent='Day 1';ps.textContent='Baseline';return;}
  // check re-assessment gate
  const gate=reassessGate();
  if(gate){pm.textContent='Cycle '+(gate+1);ps.textContent='Re-test';return;}
  if(STATE.progressPtr>=SESSIONS_PER_CYCLE*TOTAL_CYCLES){pm.textContent='Complete';ps.textContent='1 year';return;}
  const pos=posOf(STATE.progressPtr);
  pm.textContent='Week '+((pos.cycle*WEEKS_PER_CYCLE)+pos.week);
  ps.textContent='Cycle '+(pos.cycle+1)+' · Wk '+pos.week;
}
// returns cycle index that needs a re-assessment before continuing, else 0/false
function reassessGate(){
  const ptr=STATE.progressPtr;
  if(ptr>0 && ptr%SESSIONS_PER_CYCLE===0){
    const cycle=ptr/SESSIONS_PER_CYCLE; // 1 or 2 (start of cycle 2 or 3)
    if(cycle<TOTAL_CYCLES && !STATE.reassess[cycle]) return cycle;
  }
  return 0;
}

function renderToday(){
  const v=$('#v-today');
  if(!STATE.onboarded){v.innerHTML=onboardHTML();wireOnboard();return;}
  if(!STATE.baseline){v.innerHTML=baselineIntroHTML();$('#startAssess').onclick=()=>openAssessment(false);return;}
  const gate=reassessGate();
  if(gate){v.innerHTML=reassessIntroHTML(gate);$('#startReassess').onclick=()=>openAssessment(gate);return;}
  if(STATE.progressPtr>=SESSIONS_PER_CYCLE*TOTAL_CYCLES){v.innerHTML=finishedHTML();return;}
  v.innerHTML=todayWorkoutHTML();
  wireToday();
}

  if(w===4)return 'Deeper into the build — targets climb and the tougher rungs kick in.';
  if(w===5)return 'Peak weeks begin — an extra set on your key exercises. Push hard.';
  if(w===6)return 'Final peak week — the highest load of the 6-week block. Then you re-test and climb higher.';
  return 'Load increased. Keep pushing.';
}

function ensureLog(){const p=STATE.progressPtr;if(!STATE.logs[p])STATE.logs[p]={date:todayISO(),ex:{},feel:null,done:false};return STATE.logs[p];}
function toggleEx(exId){
  const sess=buildSession(STATE.progressPtr);const m=[...sess.main,sess.finisher].find(x=>x.exId===exId);
  const log=ensureLog();const st=log.ex[exId]||{sets:[],done:false};
  st.done=!st.done;
  if(st.done){st.sets=Array.from({length:m.sets},()=>true);recordPR(exId,m);}
  log.ex[exId]=st;save();haptic(14);renderToday();
}
function toggleSet(exId,i){
  const sess=buildSession(STATE.progressPtr);const m=[...sess.main,sess.finisher].find(x=>x.exId===exId);
  const log=ensureLog();const st=log.ex[exId]||{sets:[],done:false};
  st.sets=st.sets||[];st.sets[i]=!st.sets[i];
  const filled=st.sets.filter(Boolean).length;
  st.done=filled>=m.sets;
  if(st.done)recordPR(exId,m);
  log.ex[exId]=st;save();haptic(10);renderToday();
}
function recordPR(exId,m){
  const cur=STATE.prs[exId]||0;if(m.target>cur){STATE.prs[exId]=m.target;}
}
function finishSession(){
  const sess=buildSession(STATE.progressPtr);const total=sess.main.length+1;
  const log=ensureLog();const done=Object.values(log.ex).filter(x=>x.done).length;
  if(done<total){
    if(!confirm(`You've completed ${done}/${total} exercises. Mark the whole session done anyway?`))return;
  }
  // ask how it felt (auto-regulation)
  openSheet(`
    <h3>How did that feel?</h3>
    <p class="muted sm">This tunes next week's load automatically.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">

      <button class="btn ghost" onclick="commitSession('hard')">🥵 Brutal — hold the load</button>
    </div>`);
}
function commitSession(feel){
  const p=STATE.progressPtr;const pos=posOf(p);const log=ensureLog();
  log.done=true;log.feel=feel;log.completedAt=todayISO();
  const key=pos.cycle+'-'+pos.week;(STATE.weekFeel[key]=STATE.weekFeel[key]||[]).push(feel);
  // Adaptive overload: every session nudges a persistent multiplier so targets
  // keep rising as you get stronger (and ease off only if it's genuinely brutal).
  const d=feel==='easy'?0.02:(feel==='hard'?-0.03:0.006);
  STATE.adapt=clamp((typeof STATE.adapt==='number'?STATE.adapt:1)+d,0.9,1.30);
  STATE.progressPtr=p+1;
  closeSheet();save();
  toast('Session logged · '+ (feel==='easy'?'load will rise':feel==='hard'?'load steady':'nice work'));
  // celebrate + move on
  const gate=reassessGate();
  go('today');
  setTimeout(checkAchievements,650);   // celebrate any new milestone after the view settles
}

    <svg width="232" height="232" viewBox="0 0 232 232">
      <circle cx="116" cy="116" r="108" fill="none" stroke="var(--card3)" stroke-width="10"/>

/* Controlled-tempo eccentric (seconds) for guided reps: slow for strength/core,
   fast/explosive for cardio & dynamic finishers. */
function eccOf(ex){if(!ex||ex.unit!=='reps')return 0;return (ex.region==='cardio'||ex.region==='dynamic')?1:3;}
/* Gentler, back- & neck-friendly alternatives (used by the swap menu). */
const SWAP_ALT={
  plank:'deadbug',longplank:'plank',planktap:'plank',
  crunch:'deadbug',bicycle:'deadbug',tuckvup:'revcrunch',vup:'revcrunch',
  russiantwist:'seatedtwist',weightedtwist:'seatedtwist',
  sidedip:'kneeside',copenhagen:'sideplank',sideplank:'kneeside',
  legraise:'revcrunch',kneeraise:'revcrunch',hollow:'tuckhollow',hollowrock:'hollow',
  mountainclimber:'marchplace',burpee:'marchplace',squatthrust:'marchplace',
  highknees:'marchplace',skater:'marchplace',buttkick:'marchplace',jumpingjack:'marchplace',
  pushup:'kneepushup',reverselunge:'squat',
};
function ladderNeighbor(m,dir){const lad=LADDERS[m.slot];if(!lad)return null;const idx=lad.indexOf(m.exId);if(idx<0)return null;const ni=idx+dir;return (ni>=0&&ni<lad.length)?lad[ni]:null;}
function swapOptions(m){
  const opts=[];const easier=ladderNeighbor(m,-1);const harder=ladderNeighbor(m,1);
  if(easier)opts.push({kind:'easier',exId:easier,label:'⬇ Easier'});
  if(harder)opts.push({kind:'harder',exId:harder,label:'⬆ Harder'});
  const alt=SWAP_ALT[m.exId];
  if(alt&&alt!==m.exId&&alt!==easier&&alt!==harder&&EX[alt])opts.push({kind:'alt',exId:alt,label:'↔ Gentler'});
  return opts;
}
function playerSwapMenu(){
  const menu=$('#plSwapMenu');if(!menu)return;
  if(menu.style.display!=='none'){menu.style.display='none';return;}
  const m=plCur();const opts=swapOptions(m);
  if(!opts.length){toast('No alternatives for this move');return;}
  menu.innerHTML=opts.map(o=>`<button onclick="playerSwap('${o.exId}')"><span>${o.label}</span> ${EX[o.exId].name}</button>`).join('');
  menu.style.display='flex';
}
function playerSwap(exId){
  if(!PLAYER)return;const nEx=EX[exId];if(!nEx)return;
  const m=plCur();const rx=prescribe(exId,PLAYER.sess.pos);
  m.exId=exId;m.unit=nEx.unit;m.target=rx.target;m.rest=nEx.rest||m.rest;
  toast('Swapped to '+nEx.name);
  plClear();plEnterReady(false);   // restart the current set with the new move
}
function openPlayer(){
  const sess=buildSession(STATE.progressPtr);
  const items=[...sess.main,sess.finisher];
  if(!items.length)return;
  PLAYER={sess,items,i:0,s:0,phase:null,running:true,tid:null,remain:0,total:0,repN:0,elapsed:0,setsDone:0,pendingNext:false,
    tempo:Math.max(1.5,Math.min(6,(typeof STATE.settings.repTempo==='number')?STATE.settings.repTempo:3))};
  $('#player').classList.add('open');document.body.style.overflow='hidden';
  try{history.pushState({cf:'player'},'');}catch(e){}
  primeVoice();beatStart();
  plEnterReady(true);
}
function plChrome(){
  const m=plCur();const ex=EX[m.exId];const bg=ex&&ex.img?ex.img:'';
  $('#player').innerHTML=`
    <div class="pl-bg"${bg?` style="background-image:url('${bg}')"`:''}></div>
    <div class="pl-head"><button class="pl-x" onclick="playerQuit()" aria-label="Quit">✕</button>
      <div class="pl-count">${PLAYER.i+1} / ${PLAYER.items.length}</div><div style="width:36px"></div></div>
    <div class="pl-segs">${plSegsHTML()}</div>
    <div class="pl-body" id="plBody"></div>`;
}
function plBodyWork(color){
  const m=plCur();const ex=EX[m.exId];
  $('#plBody').innerHTML=`
    <div class="pl-region"><span class="tag ${ex.region}">${ex.region}</span></div>
    <div class="pl-name">${ex.name}</div>
    ${plRingHTML(color)}
    <div class="pl-set" id="plSet">SET ${PLAYER.s+1} OF ${m.sets}</div>
    <div class="pl-coach" id="plCoach"></div>
    ${swapOptions(m).length?`<button class="pl-swap" onclick="playerSwapMenu()">⇄ Swap exercise</button>`:''}
    <div class="pl-swapmenu" id="plSwapMenu" style="display:none"></div>
    <div class="pl-actions">
      <button class="btn ghost" id="plToggle" onclick="playerToggle()">Pause</button>
      <button class="btn ghost" onclick="playerSkip()">Skip</button>
      <button class="btn green" onclick="playerSetDone()">Set done ✓</button>
    </div>`;
}
function plEnterReady(first){
  plClear();plChrome();
  const m=plCur();const isTime=m.unit==='time';
  plBodyWork(isTime?'var(--green)':'var(--fire)');
  PLAYER.phase='ready';PLAYER.ready=first?5:3;
  plS('#plNum',PLAYER.ready);plS('#plSub','GET READY');plS('#plCoach','Get into position…');plRingSet(1);
  autoRoll();beep(1000,.15,0.7);
  if(!PLAYER.running){plS('#plToggle','Resume');return;}
  PLAYER.tid=setInterval(plTickReady,1000);
}
function plTickReady(){
  if(!PLAYER)return;
  PLAYER.ready--;
  if(PLAYER.ready>0){beep(1000,.15,0.7);if(PLAYER.ready<=3)coachSay(String(PLAYER.ready));plS('#plNum',PLAYER.ready);return;}
  beepGo();haptic(30);coachSay('Go!');plEnterWork();
}
// Rotate to the next spoken/shown form cue for the current exercise.
function plNextCue(){const c=PLAYER.cues||[];if(!c.length)return'';PLAYER.cueIdx=((PLAYER.cueIdx||0)+1)%c.length;const cue=c[PLAYER.cueIdx];plS('#plCoach',cue);return cue;}
function plEnterWork(){
  plClear();
  const m=plCur();const ex=EX[m.exId];const isTime=m.unit==='time';
  PLAYER.phase='work';
  PLAYER.cues=(ex.cues&&ex.cues.length)?ex.cues.slice():['Brace your core and own every rep.'];
  PLAYER.cueIdx=0;
  const firstSet=PLAYER.s===0;
  // On the first set of each exercise, coach WHAT it is + HOW it strengthens you,
  // then the first form cue. Later sets get a quick form cue.
  const intro=firstSet?(ex.name+'. '+(ex.why?ex.why+' ':'')):'';
  plS('#plCoach', firstSet&&ex.why ? ex.why : PLAYER.cues[0]);
  const pulse=$('#plPulse');
  if(isTime){
    if(pulse&&PLAYER.running)pulse.classList.add('on');
    PLAYER.remain=m.target;PLAYER.total=Math.max(1,m.target);
    plS('#plNum',fmtTime(PLAYER.remain));plS('#plSub','HOLD');plRingSet(1);
    coachSpeak(intro+PLAYER.cues[0]);
    if(PLAYER.running)PLAYER.tid=setInterval(plTickHold,1000);
  }else{
    const ecc=eccOf(ex);
    PLAYER.ecc=ecc;PLAYER.eccMs=ecc*1000;PLAYER.repDurMs=(ecc+1)*1000;
    PLAYER.repN=0;PLAYER.repMs=0;PLAYER.repCounted=false;PLAYER.total=Math.max(1,m.target);
    plS('#plNum','0');plS('#plSub','OF '+m.target+' REPS');plRingSet(0);
    const tempoLine=ecc>=2?('Controlled tempo. Lower for '+ecc+' seconds, then drive up. '+PLAYER.cues[0]):('Fast and explosive. '+PLAYER.cues[0]);
    coachSpeak(intro+tempoLine);
    if(!firstSet||!ex.why)plS('#plCoach',ecc>=2?'Lower slow…':'Go!');
    if(PLAYER.running)PLAYER.tid=setInterval(plTickRep,100);
  }
}
function plTickHold(){
  if(!PLAYER)return;
  PLAYER.remain--;PLAYER.elapsed++;
  const el=PLAYER.total-PLAYER.remain;
  if(PLAYER.remain===10&&PLAYER.total>16){if(!motivate('push'))coachSpeak('Ten seconds. Hold strong.');}
  else if(el>0&&el%8===0&&PLAYER.remain>5){
    // cycle: form cue → breathing → motivate, so coaching runs throughout the hold
    const pick=Math.floor(el/8)%3;
    if(pick===1){coachSpeak(plNextCue());}
    else if(pick===2){coachSpeak('Inhale slow… and exhale.');plS('#plSub','BREATHE');setTimeout(()=>{if(PLAYER&&PLAYER.phase==='work')plS('#plSub','HOLD');},2200);}
    else motivate('during');
  }
  if(PLAYER.remain===3)coachSpeak('Three. Two. One.');
  if(PLAYER.remain<=3&&PLAYER.remain>0)beep(900,.13,0.7);
  if(PLAYER.remain<=0){beepGo();haptic(30);plAfterSet();return;}
  plS('#plNum',fmtTime(PLAYER.remain));plRingSet(PLAYER.remain/PLAYER.total);
}
// Tempo rep engine: eccentric ("lower…") then concentric ("up!") — 100ms ticks.
function plTickRep(){
  if(!PLAYER)return;
  const m=plCur();PLAYER.repMs+=100;
  if(!PLAYER.repCounted&&PLAYER.repMs>=PLAYER.eccMs){
    PLAYER.repCounted=true;PLAYER.repN++;PLAYER.elapsed+=(PLAYER.ecc+1);
    beep(880,.08);haptic(16);
    const half=Math.ceil(m.target/2);
    plS('#plNum',String(PLAYER.repN));plRingSet(PLAYER.repN/PLAYER.total);
    // Every 4th rep, coach a form cue; otherwise call the count.
    if(PLAYER.repN>1&&PLAYER.repN%4===0&&PLAYER.repN<m.target){coachSpeak(plNextCue());}
    else if(m.target>=8&&PLAYER.repN===half){if(!motivate('during'))coachSpeak('Up! '+PLAYER.repN);}
    else coachSpeak(PLAYER.ecc>=2?('Up! '+PLAYER.repN):String(PLAYER.repN));
  }
  if(PLAYER.repMs>=PLAYER.repDurMs){
    if(PLAYER.repN>=m.target){haptic(30);plClear();plAfterSet();return;}
    PLAYER.repMs=0;PLAYER.repCounted=false;
    plS('#plCoach',PLAYER.ecc>=2?'Lower slow…':'Go!');
  }
}
function plAfterSet(){
  plClear();
  const m=plCur();
  try{markSetFromTimer(m.exId);}catch(e){}
  PLAYER.setsDone++;
  const pulse=$('#plPulse');if(pulse)pulse.classList.remove('on');
  PLAYER.s++;
  if(PLAYER.s<m.sets){if(!motivate('rest'))coachSpeak('Rest.');plEnterRest(m.rest,'set');}
  else if(PLAYER.i+1<PLAYER.items.length){if(!motivate('rest'))coachSpeak('Nice. Next up.');PLAYER.pendingNext=true;plEnterRest(m.rest,'ex');}
  else plEnterDone();
}
function plEnterRest(dur,type){
  plClear();PLAYER.phase='rest';PLAYER.remain=Math.max(1,dur|0);PLAYER.total=PLAYER.remain;
  const m=plCur();let name,img,rx;
  if(type==='set'){const ex=EX[m.exId];name='Next set · '+ex.name;img=ex.img;rx='Set '+(PLAYER.s+1)+' of '+m.sets+' · '+(m.unit==='time'?fmtTime(m.target):m.target+' reps');}
  else{const nm=PLAYER.items[PLAYER.i+1];const nex=EX[nm.exId];name='Up next · '+nex.name;img=nex.img;rx=nm.sets+' × '+(nm.unit==='time'?fmtTime(nm.target):nm.target+' reps');}
  $('#plBody').innerHTML=`
    <div class="pl-region"><span class="tag cardio">REST</span></div>
    <div class="pl-name">Recover</div>
    ${plRingHTML('var(--fire-l)')}
    <div class="pl-coach" id="plCoach">Breathe. Shake it out.</div>
    <div class="pl-next">${img?`<img src="${img}" alt="" onerror="this.style.display='none'">`:''}<div><div style="font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--muted)">${name}</div><div style="font-weight:800;margin-top:2px">${rx}</div></div></div>
    <div class="pl-actions">
      <button class="btn ghost" onclick="playerAddRest()">+15s</button>
      <button class="btn ghost" id="plToggle" onclick="playerToggle()">Pause</button>
      <button class="btn primary" onclick="playerSkipRest()">Skip ▶</button>
    </div>`;
  plS('#plNum',fmtTime(PLAYER.remain));plS('#plSub','REST');plRingSet(1);
  if(PLAYER.running)PLAYER.tid=setInterval(plTickRest,1000);else plS('#plToggle','Resume');
}
function plTickRest(){
  if(!PLAYER)return;
  PLAYER.remain--;
  if(PLAYER.remain===3)coachSpeak('Three. Two. One.');
  if(PLAYER.remain<=3&&PLAYER.remain>0)beep(900,.13,0.7);
  if(PLAYER.remain<=0){plRestDone();return;}
  plS('#plNum',fmtTime(PLAYER.remain));plRingSet(PLAYER.remain/PLAYER.total);
}
function plRestDone(){plClear();if(PLAYER.pendingNext){PLAYER.pendingNext=false;PLAYER.i++;PLAYER.s=0;}plEnterReady(false);}
function plEnterDone(){
  plClear();beatStop();PLAYER.phase='done';
  const sess=PLAYER.sess;const wk=(sess.cycle*WEEKS_PER_CYCLE)+sess.week;
  $('#plBody').innerHTML=`
    <div class="pl-name" style="margin-bottom:2px">Session complete 🔥</div>
    <div class="pl-coach" style="margin-bottom:14px">${sess.session.name} · Week ${wk}</div>
    <div class="grid3" style="width:100%;max-width:440px">
      <div class="stat"><div class="n" style="color:var(--fire-l)">${fmtTime(PLAYER.elapsed||1)}</div><div class="l">Time</div></div>
      <div class="stat"><div class="n" style="color:var(--teal)">${PLAYER.setsDone}</div><div class="l">Sets</div></div>
      <div class="stat"><div class="n" style="color:var(--green)">${PLAYER.items.length}</div><div class="l">Moves</div></div>
    </div>
    <div class="pl-set" style="margin-top:20px">HOW DID THAT FEEL?</div>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px;margin-top:8px">
      <button class="btn green" onclick="playerFeel('easy')">😎 Easy — bring more</button>
      <button class="btn primary" onclick="playerFeel('right')">💪 Challenging — just right</button>
      <button class="btn ghost" onclick="playerFeel('hard')">🥵 Brutal — hold the load</button>
    </div>`;
  if(!motivate('done'))coachSpeak('Session complete. Outstanding work.');
}
function playerToggle(){
  if(!PLAYER)return;
  PLAYER.running=!PLAYER.running;
  const t=$('#plToggle');if(t)t.textContent=PLAYER.running?'Pause':'Resume';
  const pulse=$('#plPulse');
  if(!PLAYER.running){plClear();if(pulse)pulse.classList.remove('on');return;}
  if(PLAYER.phase==='ready')PLAYER.tid=setInterval(plTickReady,1000);
  else if(PLAYER.phase==='work'){const m=plCur();if(m.unit==='time'){if(pulse)pulse.classList.add('on');PLAYER.tid=setInterval(plTickHold,1000);}else PLAYER.tid=setInterval(plTickRep,100);}
  else if(PLAYER.phase==='rest')PLAYER.tid=setInterval(plTickRest,1000);
}
function playerSkip(){
  if(!PLAYER)return;plClear();
  const pulse=$('#plPulse');if(pulse)pulse.classList.remove('on');
  if(PLAYER.i+1<PLAYER.items.length){PLAYER.i++;PLAYER.s=0;plEnterReady(false);}else plEnterDone();
}
function playerSetDone(){if(PLAYER&&(PLAYER.phase==='work'||PLAYER.phase==='ready')){plClear();plAfterSet();}}
function playerAddRest(){if(PLAYER&&PLAYER.phase==='rest'){PLAYER.remain+=15;PLAYER.total+=15;plS('#plNum',fmtTime(PLAYER.remain));toast('+15s rest');}}
function playerSkipRest(){if(PLAYER&&PLAYER.phase==='rest')plRestDone();}
function playerTeardown(){if(!PLAYER)return;plClear();beatStop();$('#player').classList.remove('open');document.body.style.overflow='';PLAYER=null;if(TAB==='today')renderToday();}
function playerQuit(){const had=!!PLAYER;playerTeardown();if(had&&history.state&&history.state.cf==='player'){_backGuard=true;try{history.back();}catch(e){_backGuard=false;}}}
function playerFeel(feel){
  plClear();$('#player').classList.remove('open');document.body.style.overflow='';PLAYER=null;
  if(history.state&&history.state.cf==='player'){_backGuard=true;try{history.back();}catch(e){_backGuard=false;}}
  commitSession(feel);
}

/* ============================ HIIT INTERVAL PLAYER ============================
   Tabata / EMOM / AMRAP interval formats for the Metabolic HIIT day. Runs the
   circuit as work↔rest intervals over the .pl overlay with ring, beeps, coach
   and beat. Separate state (INTV) from the guided player. */
let INTV=null;
const IV_C=2*Math.PI*108;
const HIIT_FORMATS={
  tabata:{name:'Tabata',desc:'8 rounds · 20s all-out / 10s rest (~4 min). Brutal and fast.'},
  emom:{name:'EMOM',desc:'Every minute: 45s work / 15s rest, cycling the circuit.'},
  amrap:{name:'AMRAP 10',desc:'10 minutes — as many rounds of the circuit as you can.'},
};
function ivS(sel,txt){const e=$(sel);if(e)e.textContent=txt;}
function ivRingSet(f){const r=$('#ivRing');if(r)r.style.strokeDashoffset=IV_C*(1-Math.max(0,Math.min(1,f)));}
function ivClear(){if(INTV&&INTV.tid){clearInterval(INTV.tid);INTV.tid=null;}}
function buildIntervals(list,format){
  const out=[];const at=i=>list[i%list.length];
  if(format==='tabata'){for(let r=0;r<8;r++){out.push({type:'work',secs:20,exId:at(r).exId,round:r+1,rounds:8});out.push({type:'rest',secs:10,exId:at(r+1).exId});}}
  else if(format==='emom'){const mins=Math.max(6,list.length);for(let r=0;r<mins;r++){out.push({type:'work',secs:45,exId:at(r).exId,round:r+1,rounds:mins});out.push({type:'rest',secs:15,exId:at(r+1).exId});}}
  else{const cap=600;let t=0,i=0;while(t<cap){const w=Math.min(40,cap-t);out.push({type:'work',secs:w,exId:at(i).exId,round:Math.floor(i/list.length)+1});t+=w;i++;if(t<cap){const rs=Math.min(5,cap-t);if(rs>0){out.push({type:'rest',secs:rs,exId:at(i).exId});t+=rs;}}}}
  if(out.length&&out[out.length-1].type==='rest')out.pop();
  return out;
}
function openHiitChooser(){
  openSheet(`<h3>⚡ HIIT intervals</h3>
    <p class="muted sm" style="margin:2px 0 12px">Run today's circuit as timed intervals. Pick a format:</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${Object.keys(HIIT_FORMATS).map(k=>`<button class="btn ghost" style="text-align:left;display:block;padding:14px" onclick="startHiit('${k}')"><b style="font-size:15px">${HIIT_FORMATS[k].name}</b><div class="tiny muted" style="margin-top:3px;font-weight:600">${HIIT_FORMATS[k].desc}</div></button>`).join('')}
    </div>
    <div style="height:8px"></div><button class="btn ghost" onclick="closeSheet()">Cancel</button>`);
}
function ivRingHTML(color){return `
  <div class="pl-ring"><div class="pl-pulse" id="ivPulse"></div>
    <svg width="232" height="232" viewBox="0 0 232 232">
      <circle cx="116" cy="116" r="108" fill="none" stroke="var(--card3)" stroke-width="10"/>
      <circle id="ivRing" cx="116" cy="116" r="108" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${IV_C}" stroke-dashoffset="0"/>
    </svg>
    <div class="pl-center"><div class="pl-num" id="ivNum">0</div><div class="pl-sub" id="ivSub">GO</div></div>
  </div>`;}
function startHiit(format){
  closeSheet();
  const sess=buildSession(STATE.progressPtr);
  const list=[...sess.main,sess.finisher].filter(m=>m&&m.exId);
  if(!list.length)return;
  INTV={sess,seq:buildIntervals(list,format),i:0,phase:null,running:true,tid:null,remain:0,total:0,format,workElapsed:0};
  $('#hiit').classList.add('open');document.body.style.overflow='hidden';
  try{history.pushState({cf:'hiit'},'');}catch(e){}
  primeVoice();beatStart();
  ivRenderStep(0);
  INTV.phase='lead';INTV.lead=5;
  ivS('#ivNum','5');ivS('#ivSub','GET READY');ivRingSet(1);
  beep(1000,.15,0.7);coachSpeak(HIIT_FORMATS[format].name+'. Get ready.');
  INTV.tid=setInterval(ivTickLead,1000);
}
function ivTickLead(){
  if(!INTV)return;INTV.lead--;
  if(INTV.lead>0){beep(1000,.15,0.7);if(INTV.lead<=3)coachSay(String(INTV.lead));ivS('#ivNum',INTV.lead);return;}
  beepGo();haptic(30);coachSay('Go!');ivClear();ivStep(0);
}
function ivRenderStep(idx){
  const step=INTV.seq[idx];const ex=EX[step.exId]||{name:'Work',region:'cardio',img:''};const isWork=step.type==='work';
  const bg=ex.img||'';
  $('#hiit').innerHTML=`
    <div class="pl-bg"${bg?` style="background-image:url('${bg}')"`:''}></div>
    <div class="pl-head"><button class="pl-x" onclick="hiitQuit()" aria-label="End">✕</button>
      <div class="pl-count">${HIIT_FORMATS[INTV.format].name} · ${idx+1}/${INTV.seq.length}</div><div style="width:36px"></div></div>
    <div class="pl-body" id="ivBody">
      <div class="pl-region"><span class="tag ${isWork?ex.region:'cardio'}">${isWork?'WORK':'REST'}</span></div>
      <div class="pl-name">${isWork?ex.name:'Rest — next: '+ex.name}</div>
      ${ivRingHTML(isWork?'var(--green)':'var(--fire-l)')}
      <div class="pl-set">${step.round?('ROUND '+step.round+(step.rounds?(' / '+step.rounds):'')):'Keep moving'}</div>
      <div class="pl-coach" id="ivCoach">${isWork?'Max effort — every rep counts.':'Breathe. Reset.'}</div>
      <div class="pl-actions">
        <button class="btn ghost" id="ivToggle" onclick="hiitToggle()">Pause</button>
        <button class="btn ghost" onclick="hiitSkip()">Skip</button>
        <button class="btn primary" onclick="hiitQuit()">End</button>
      </div>
    </div>`;
}
function ivStep(idx){
  if(typeof idx==='number')INTV.i=idx;
  const step=INTV.seq[INTV.i];const ex=EX[step.exId]||{name:'Work'};const isWork=step.type==='work';
  ivClear();INTV.phase=isWork?'work':'rest';INTV.remain=step.secs;INTV.total=Math.max(1,step.secs);
  ivRenderStep(INTV.i);
  ivS('#ivNum',fmtTime(INTV.remain));ivS('#ivSub',isWork?'WORK':'REST');ivRingSet(1);
  const pulse=$('#ivPulse');if(pulse){if(isWork&&INTV.running)pulse.classList.add('on');else pulse.classList.remove('on');}
  autoRoll();
  if(isWork){beep(1320,.12,0.85);if(!motivate('during'))coachSpeak('Work! '+ex.name);}
  else coachSpeak('Rest.');
  if(INTV.running)INTV.tid=setInterval(ivTick,1000);
}
function ivTick(){
  if(!INTV)return;
  INTV.remain--;
  if(INTV.phase==='work')INTV.workElapsed++;
  if(INTV.remain===3)coachSpeak('Three. Two. One.');
  if(INTV.remain<=3&&INTV.remain>0)beep(900,.13,0.7);
  if(INTV.remain<=0){beepGo();haptic(30);INTV.i++;if(INTV.i>=INTV.seq.length){ivDone();return;}ivStep();return;}
  ivS('#ivNum',fmtTime(INTV.remain));ivRingSet(INTV.remain/INTV.total);
}
function ivDone(){
  ivClear();beatStop();INTV.phase='done';
  const mins=Math.max(1,Math.round(INTV.workElapsed/60*10)/10);
  const sess=INTV.sess;const isMetcon=sess.session.key==='metcon'&&sess.ptr===STATE.progressPtr;
  $('#ivBody').innerHTML=`
    <div class="pl-name" style="margin-bottom:2px">Circuit complete 🔥</div>

/* ---- Baseline test timer: Start -> 3·2·1 -> run -> Stop ----
   Timed holds count UP until you stop (elapsed seconds = your result).
   The 60s bicycle test counts DOWN and stops itself, then you enter reps. */
let _bt=null;
function stopBaselineTimer(){if(_bt){clearInterval(_bt.iv);_bt=null;}}
function coachSay(txt){try{if(typeof coachSpeak==='function')coachSpeak(txt);}catch(e){}}
function startBaselineTimer(){
  const t=TESTS[assessState.idx];const dur=t.dur||0; // dur>0 => count down; else count up
  stopBaselineTimer();autoRoll();try{if(typeof primeVoice==='function')primeVoice();}catch(e){}
  openSheet(baselineTimerHTML(t));
  _bt={iv:setInterval(tick,1000),mode:'ready',ready:3,elapsed:0,dur:dur,tid:t.id};
  paintReady();coachSay('Get ready.');
  function paintReady(){const b=$('#btBig');if(b){b.textContent=_bt.ready;b.className='tnum rest';}const l=$('#btLbl');if(l)l.textContent='GET READY';const h=$('#btHint');if(h)h.textContent='Get into position…';}
  function paintRun(){const b=$('#btBig');if(b){b.textContent=dur?fmtTime(Math.max(0,dur-_bt.elapsed)):fmtTime(_bt.elapsed);b.className='tnum go';}const l=$('#btLbl');if(l)l.textContent=dur?'TIME LEFT':'HOLD — ELAPSED';const h=$('#btHint');if(h)h.textContent=dur?'Go! Count every rep.':'Hold your best form. Tap Stop when you break.';const a=$('#btAction');if(a){a.style.display='block';a.textContent=dur?'■ Stop early':'■ Stop & save';}}
  function tick(){
    if(!_bt)return;
    if(_bt.mode==='ready'){
      _bt.ready--;
      if(_bt.ready>0){beep(660,.09);coachSay(String(_bt.ready));paintReady();}
      else{beep(990,.14);haptic(20);if(!motivate('start'))coachSay('Go!');_bt.mode='run';_bt.elapsed=0;paintRun();}
      return;
    }
    _bt.elapsed++;
    if(dur){
      const left=dur-_bt.elapsed;
      if(left===10){if(!motivate('push'))coachSay('Ten seconds left.');}
      else if(_bt.elapsed>0&&_bt.elapsed%10===0&&left>4)motivate('during');
      if(left<=3&&left>0)beep(660,.08);
      if(left<=0){beep(880,.28);haptic(30);if(!motivate('done'))coachSay('Time. Enter your reps.');stopBaselineTimer();backToAssessStep(false);return;}
    }else{
      // open-ended hold: push periodically the longer they hold
      if(_bt.elapsed>0&&_bt.elapsed%10===0)motivate('during');
    }
    paintRun();
  }
}
function baselineStop(){ // user tapped Stop
  const dur=_bt&&_bt.dur,elapsed=_bt?_bt.elapsed:0,running=_bt&&_bt.mode==='run';
  stopBaselineTimer();
  if(running&&!dur){const t=TESTS[assessState.idx];assessState.results[t.id]=elapsed;if(!motivate('done'))coachSay('Time. Strong hold.');}
  backToAssessStep(true);
}
function baselineCancel(){stopBaselineTimer();renderAssessStep();}
function backToAssessStep(focus){
  renderAssessStep();

}
function baselineTimerHTML(t){
  return `
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="tiny muted">${t.name}</div><button class="chip" onclick="baselineCancel()">Cancel</button></div>
  <div class="timerbox" style="padding:22px 0 6px">

function assessNav(dir){

/* ============================ VOICE COACH ============================ */
/* Deep-voiced spoken coaching: pre-workout brief, timer callouts, exercise cues.
   Uses the Web Speech API with a low pitch (0.6) and a male/deep voice when the
   device exposes one. Automatic callouts obey the Voice-coach setting; manual
   buttons (brief / test / hear cues) always speak. */
let COACH_VOICES=[], COACH_V=null, _voicePrimed=false;
function loadCoachVoices(){
  try{COACH_VOICES=('speechSynthesis'in window)?speechSynthesis.getVoices():[];}catch(e){COACH_VOICES=[];}
  COACH_V=resolveVoice();
  // if the Guide/Settings tab is open, refresh so the picker fills in once the OS loads voices
  try{if($('#v-guide')&&$('#v-guide').classList.contains('active'))renderGuide();}catch(e){}
}
function resolveVoice(){
  if(!COACH_VOICES.length)return null;
  const want=STATE.settings.voiceName;
  if(want){const v=COACH_VOICES.find(x=>x.name===want);if(v)return v;}
  return pickDeepVoice();
}
function pickDeepVoice(){
  if(!COACH_VOICES.length)return null;
  const en=COACH_VOICES.filter(v=>/^en/i.test(v.lang));
  const pool=en.length?en:COACH_VOICES;
  // Prefer voices whose names read as deep / male
  const deep=['google uk english male','microsoft guy','microsoft david','microsoft mark','microsoft george','daniel','arthur','james','fred','aaron','albert','oliver','gordon','reed','rishi','deep','baritone','male'];
  for(const hint of deep){const v=pool.find(x=>x.name&&x.name.toLowerCase().includes(hint));if(v)return v;}
  // Otherwise skip obviously female-named voices
  const female=/female|samantha|victoria|karen|moira|tessa|fiona|serena|zira|susan|allison|ava|zoe|catherine|amelie|anna|nicky|kate|hazel|linda|heera|veena/i;
  return pool.find(x=>x.name&&!female.test(x.name))||pool[0];
}
function primeVoice(){
  if(_voicePrimed)return;_voicePrimed=true;
  try{loadCoachVoices();if('speechSynthesis'in window&&!COACH_VOICES.length){speechSynthesis.onvoiceschanged=loadCoachVoices;}}catch(e){}
}
function coachSpeak(text,force){
  try{
    if(!force&&STATE.settings.voice===false)return false;
    if(!('speechSynthesis'in window))return false;
    if(!COACH_VOICES.length)loadCoachVoices();
    const synth=speechSynthesis;synth.cancel();
    const u=new SpeechSynthesisUtterance(String(text||''));
    u.lang='en-US';u.volume=1;
    u.rate=(typeof STATE.settings.voiceRate==='number')?STATE.settings.voiceRate:0.98;
    u.pitch=(typeof STATE.settings.voicePitch==='number')?STATE.settings.voicePitch:0.6; // lower = deeper
    if(COACH_V)u.voice=COACH_V;
    duckFor(u);synth.speak(u);return true;
  }catch(e){return false;}
}
/* Duck the beat while a coach utterance plays, then swell it back. */
function duckFor(u){
  try{
    let done=false;const end=()=>{if(done)return;done=true;beatDuck(false);};
    beatDuck(true);
    u.onend=end;u.onerror=end;
    // safety: if onend never fires, release after a length-based estimate
    const est=Math.min(12000,900+String(u.text||'').length*80);
    setTimeout(end,est);
  }catch(e){}
}
function coachBrief(){
  primeVoice();
  const sess=buildSession(STATE.progressPtr);
  const wkNum=(sess.cycle*WEEKS_PER_CYCLE)+sess.week;
  const name=(STATE.profile.name||'').trim();
  const who=name?name+', ':'';
  const msg=`${who}welcome to week ${wkNum}. Today: ${sess.session.name}. ${sess.session.focus}. `+
    `${sess.main.length+1} exercises. Brace every rep, control the tempo, and own the burn. Let's get to work.`;
  coachSpeak(msg,true);
}

  const ex=EX[exId];if(!ex)return;primeVoice();
  coachSpeak(`${ex.name}. ${ex.cues.join('. ')}.`,true);
}
function testVoice(){primeVoice();coachSpeak("Core Forge voice coach, ready. Brace your core, and let's get to work.",true);}
function sampleVoice(){primeVoice();coachSpeak("Brace your core. Deep and steady. Let's work.",true);}
/* Voice-picker + depth/speed helpers */
function _ve(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function voiceOptionsHTML(){
  if(!COACH_VOICES.length)return '<option value="">Tap "Test voice" to load voices…</option>';
  const en=COACH_VOICES.filter(v=>/^en/i.test(v.lang));
  const list=en.length?en:COACH_VOICES;

}

function setBeatVol(v){STATE.settings.beatVol=Math.max(0.05,Math.min(1,parseFloat(v)||0.55));save();if(BEAT&&BEAT.on){BEAT.vol=beatVolPref()*0.9;const g=BEAT.master.gain,t=BEAT.ac.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(Math.max(0.0002,g.value),t);g.exponentialRampToValueAtTime(Math.max(0.0002,BEAT.vol),t+0.2);}}

/* Auto mode ('auto'): rotate through a random coach each exercise, so the voice
   changes from time to time without you picking one. _autoId holds the current pick. */
let _autoId=null,_autoBag=[];
function rollAutoPersona(){
  // Shuffle-bag: play through ALL coaches once (shuffled) before any repeats,
  // so Auto is guaranteed to cycle through every one of them.
  if(!_autoBag.length){
    _autoBag=COACHES.map(c=>c.id);
    for(let i=_autoBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=_autoBag[i];_autoBag[i]=_autoBag[j];_autoBag[j]=t;}
    if(_autoBag.length>1&&_autoBag[0]===_autoId){const t=_autoBag[0];_autoBag[0]=_autoBag[1];_autoBag[1]=t;} // no back-to-back across bags
  }
  _autoId=_autoBag.shift();return _autoId;
}

function autoRoll(){if(STATE.settings.coach==='auto')rollAutoPersona();}
function currentPersona(){
  if(STATE.settings.coach==='auto'){
    if(!_autoId)rollAutoPersona();

  }
  return COACHES.find(c=>c.id===STATE.settings.coach)||COACHES[0];
}

      else if(el>0&&el%10===0&&remain>4)motivate('during');   // periodic push through the hold
    }else{
      if(remain===10&&total>13)coachSpeak('Ten seconds. Get ready.');
      else if(total>=24&&el===Math.round(total/2))motivate('rest');
    }
    if(remain===3)coachSpeak('Three. Two. One.');
    if(remain<=3&&remain>0)beep(900,.13,0.7);
    if(remain<=0){
      beepGo();haptic(30);clearInterval(timer.iv);
      if(isHold&&restAfter>0){toast('Hold done! Resting '+restAfter+'s');if(!motivate('done'))coachSpeak('Time. Now rest.');setTimeout(()=>runTimer('rest',restAfter,label+' — rest',0,null,true),700);if(onDone)onDone();return;}
      if(onDone)onDone();
      if(!motivate('done'))coachSpeak(isHold?'Time. Strong hold.':'Rest over. Back to work.');
      $('#tnum')&&($('#tnum').textContent='Done');
      setTimeout(()=>closeSheet(),700);return;
    }
    update();
  }
  function update(){if(phase==='ready')return;const n=$('#tnum');if(n){n.textContent=fmtTime(remain);}const r=$('#tring');if(r){r.style.strokeDashoffset=C*(1-remain/total);} }
  timer={iv:setInterval(tick,1000),mode};
  update();
}

/* ===== GUIDED REP CADENCE ===== */
/* Paces reps aloud at repTempo seconds each, then flows into the spoken
   between-sets rest timer. Reuses the `timer` global (mode 'reps'). */
let _repTok=0;
function startGuidedReps(exId){
  const sess=buildSession(STATE.progressPtr);const m=[...sess.main,sess.finisher].find(x=>x.exId===exId);
  const ex=EX[exId];
  runRepCadence(m.target,ex.name,m.rest,()=>markSetFromTimer(exId));
}
function cancelReps(){_repTok++;stopTimer();closeSheet();}
function runRepCadence(reps,label,restAfter,onDone){
  const total=Math.max(1,reps);let n=0;
  const tempo=Math.max(1.5,Math.min(6,(typeof STATE.settings.repTempo==='number')?STATE.settings.repTempo:3));
  const C=2*Math.PI*100;
  openSheet(repHTML(label,total));
  autoRoll();primeVoice();beatStart();
  const setP=(t)=>{const e=$('#rcphase');if(e)e.textContent=t;};
  function paint(){const nn=$('#rcNum');if(nn)nn.textContent=n;const rr=$('#rcRing');if(rr)rr.style.strokeDashoffset=C*(1-n/total);}
  const half=Math.ceil(total/2);
  // 5-second loud GET READY before the reps begin
  let ready=5;const rn=$('#rcNum');if(rn){rn.textContent='5';rn.className='tnum rest';}setP('GET READY');
  beep(1000,.15,0.7);coachSpeak('Guided set. '+total+' reps. Get ready.');
  function readyTick(){
    ready--;
    if(ready>0){beep(1000,.15,0.7);if(ready<=3)coachSay(String(ready));const e=$('#rcNum');if(e)e.textContent=ready;return;}
    beepGo();haptic(30);coachSay('Go!');clearInterval(timer.iv);
    const e=$('#rcNum');if(e){e.textContent='0';e.className='tnum go';}setP('OF '+total+' REPS');
    timer={iv:setInterval(step,tempo*1000),mode:'reps'};
  }
  function step(){
    n++;
    beep(760,.06);haptic(14);
    if(total>=8&&n===half){if(!motivate('during'))coachSpeak(String(n));}   // mid-set push
    else coachSpeak(String(n));
    paint();
    if(n>=total){
      stopTimer();
      const tok=++_repTok,rest=restAfter,done=onDone,lbl=label;
      setTimeout(()=>{
        if(tok!==_repTok)return;               // cancelled or superseded
        if(!motivate('done'))coachSpeak('Set complete. Strong work.');
        if(done)done();
        if(rest>0)runTimer('rest',rest,lbl+' — rest',0,null);
        else{const nn=$('#rcNum');if(nn)nn.textContent='✓';setTimeout(closeSheet,700);}
      },Math.max(400,tempo*450));
    }
  }
  timer={iv:setInterval(readyTick,1000),mode:'reps'};
}

  return `

/* ===== GUIDED WARM-UP / COOL-DOWN FLOW =====
   Walks a sequence of {n,secs,cue} moves: 5s loud GET READY, then each move
   with its own count-down, loud transition beeps and spoken coaching. */
function runWarmup(){runFlow(WARMUP_FLOW,'Warm-up','var(--fire)');}
function runCooldown(){runFlow(COOLDOWN_FLOW,'Cool-down','var(--teal)');}
function runFlow(items,title,color){
  let idx=0,phase='ready',ready=5,remain=0,total=Math.max(1,items[0].secs);
  const C=2*Math.PI*100;
  openSheet(flowHTML(title,items.length,color||'var(--fire)'));
  primeVoice();beatStart();
  const set=(sel,txt)=>{const e=$(sel);if(e)e.textContent=txt;};
  const ring=(frac)=>{const r=$('#flowRing');if(r)r.style.strokeDashoffset=C*(1-frac);};
  set('#flowName','Get Ready'); set('#flowCue', items[0].n+' first.');
  beep(1000,.15,0.7); coachSpeak(title+'. Get ready.'); ring(1);
  function startItem(){
    const it=items[idx]; remain=it.secs; total=Math.max(1,it.secs);
    set('#flowNum',remain); set('#flowName',it.n); set('#flowCue',it.cue||'');
    set('#flowStep',(idx+1)+' / '+items.length);
    beepGo(); haptic(30); coachSpeak(it.n+'. '+(it.cue||'')); ring(1);
  }
  function tick(){
    if(phase==='ready'){
      ready--;
      if(ready>0){beep(1000,.15,0.7);if(ready<=3)coachSay(String(ready));set('#flowNum',ready);return;}
      phase='run'; startItem(); return;
    }
    remain--;
    if(remain===5&&total>10)coachSpeak('Five seconds.');
    if(remain===3)coachSpeak('Three. Two. One.');
    if(remain<=3&&remain>0)beep(900,.13,0.7);
    if(remain<=0){
      idx++;
      if(idx>=items.length){
        beepGo();haptic(30);clearInterval(timer.iv);
        set('#flowNum','✓');set('#flowName','Done');set('#flowCue',title+' complete. Nice work.');
        set('#flowStep',items.length+' / '+items.length);ring(0);
        coachSpeak(title+' complete. Nice work.');
        setTimeout(closeSheet,1100);return;
      }
      beep(1000,.16,0.75); startItem(); return;
    }
    set('#flowNum',remain); ring(remain/total);
  }
  timer={iv:setInterval(tick,1000),mode:'flow'};
}
function flowHTML(title,count,color){
  const C=2*Math.PI*100;
  return `

function capturePhoto(pose){_pendingPose=pose;const inp=$('#photoInput');if(inp){inp.value='';inp.click();}}
function onPhotoPicked(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1000;let{width:w,height:hh}=img;
      if(w>MAX||hh>MAX){const s=MAX/Math.max(w,hh);w=Math.round(w*s);hh=Math.round(hh*s);}
      const c=document.createElement('canvas');c.width=w;c.height=hh;
      c.getContext('2d').drawImage(img,0,0,w,hh);
      let data;try{data=c.toDataURL('image/jpeg',0.82);}catch(err){data=r.result;}
      const id=todayISO()+'-'+(_pendingPose||'front')+'-'+(Object.keys(STATE.photos).length+ (STATE.photos.length))+'-'+Math.floor(performance.now());
      idbPut('ph_'+id,data);
      STATE.photos.push({id,date:todayISO(),pose:_pendingPose||'front'});
      save();toast('Photo saved');renderProgress();checkAchievements();
    };
    img.onerror=()=>toast('Could not read that image');
    img.src=r.result;
  };
  r.readAsDataURL(f);
}
async function hydratePhotos(){
  const imgs=$$('#v-progress .ph-img');
  for(const el of imgs){
    const id=el.getAttribute('data-pid');if(!id||el._loaded)continue;
    const data=await idbGet('ph_'+id);if(data){el.src=data;el._loaded=true;}
  }
}

/* ============================ REMINDERS ============================
   Best-effort local reminders: on a training day, if you haven't trained and
   it's past your set time, CoreForge nudges you when the app opens (and fires a
   local notification if you've granted permission). Reliable background push
   would need a server; this keeps everything on-device. */
function trainedToday(){return Object.values(STATE.logs||{}).some(l=>l.done&&l.completedAt===todayISO());}
function isTrainingDay(){const days=STATE.profile.days||[];return days.includes(new Date().getDay());}
function toggleReminders(){
  if(STATE.settings.reminderOn){STATE.settings.reminderOn=false;save();renderGuide();return;}
  if('Notification'in window&&Notification.permission!=='granted'){
    Notification.requestPermission().then(p=>{STATE.settings.reminderOn=(p==='granted');save();renderGuide();
      if(p==='granted')toast('Reminders on');else toast('Allow notifications to get reminders');});
  }else{STATE.settings.reminderOn=true;save();toast('Reminders on');renderGuide();}
}
function setReminderTime(v){if(v){STATE.settings.reminderTime=v;save();}}
function fireReminderNotif(){
  const body="Time to train your core 💪 Keep your streak alive.";
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(r=>r.showNotification('CoreForge',{body,icon:'icon-192.png',badge:'icon-192.png',tag:'coreforge-reminder'}));}
    else if('Notification'in window){new Notification('CoreForge',{body,icon:'icon-192.png'});}
  }catch(e){}
}
function checkReminder(){
  const s=STATE.settings;if(!s)return;
  // Saturday weekly progress check-in (photo + waist + weigh-in) — once per week
  if(s.weeklyOn!==false && isSaturday() && STATE._weeklyRemindedWeek!==weekKey()){
    STATE._weeklyRemindedWeek=weekKey();save();
    if('Notification'in window&&Notification.permission==='granted'){try{fireWeeklyNotif();}catch(e){}}
  }
  if(!s.reminderOn)return;
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  if(!isTrainingDay()||trainedToday())return;
  const [hh,mm]=(s.reminderTime||'18:00').split(':').map(Number);const now=new Date();
  const past=now.getHours()>hh||(now.getHours()===hh&&now.getMinutes()>=mm);
  if(!past)return;
  if(STATE._remindedOn===todayISO())return;
  STATE._remindedOn=todayISO();save();
  fireReminderNotif();toast('⏰ Time to train — keep your streak!');
}
function computeStreak(){
  const dates=[...new Set(Object.values(STATE.logs).filter(l=>l.done&&l.completedAt).map(l=>l.completedAt))].sort();
  if(!dates.length)return 0;
  // streak = consecutive distinct training days ending at the most recent, allowing 1 rest day gap
  let streak=1;
  for(let i=dates.length-1;i>0;i--){
    const gap=(new Date(dates[i])-new Date(dates[i-1]))/86400000;
    if(gap<=3)streak++;else break;
  }
  return streak;
}
function totalTUT(){
  let mins=0;
  Object.keys(STATE.logs).forEach(p=>{const l=STATE.logs[p];if(l.done){const s=buildSession(+p);mins+=sessionVolume(s).minutes;}});
  return mins;
}
/* ---- richer progress metrics ---- */
function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekStartD(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x;}
function sessionsThisWeek(){const s=weekStartD(new Date());return Object.values(STATE.logs).filter(l=>l.done&&l.completedAt&&new Date(l.completedAt+'T00:00:00')>=s).length;}
function totalVolume(){let reps=0,hold=0,sets=0;Object.keys(STATE.logs).forEach(p=>{const l=STATE.logs[p];if(!l.done)return;const s=buildSession(+p);[...s.main,s.finisher].forEach(m=>{const e=l.ex&&l.ex[m.exId];const sd=e&&e.sets?e.sets.filter(Boolean).length:0;sets+=sd;if(m.unit==='time')hold+=sd*m.target;else reps+=sd*m.target;});});return {reps,hold,sets};}
