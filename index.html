/* Reusable dated line graph (SVG). vals[i] plotted against dates[i]. */
function lineChart(vals,dates,color,unit){
  if(!vals||!vals.length)return '';
  const W=320,H=132,padL=6,padR=6,padT=14,padB=22,n=vals.length;
  const mn=Math.min(...vals),mx=Math.max(...vals),range=(mx-mn)||1;
  const X=i=>padL+(n===1?(W-padL-padR)/2:i*(W-padL-padR)/(n-1));
  const Y=v=>padT+(1-(v-mn)/range)*(H-padT-padB);
  const line=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const area=`${X(0).toFixed(1)},${(H-padB).toFixed(1)} ${line} ${X(n-1).toFixed(1)},${(H-padB).toFixed(1)}`;
  const dots=vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.4" fill="${color}"/>`).join('');
  const u=unit||'';
  const xlab=(i,a)=>`<text x="${X(i).toFixed(1)}" y="${H-6}" fill="var(--dim)" font-size="9" text-anchor="${a}">${(dates[i]||'').slice(5)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;margin-top:10px;height:132px">
    <polygon points="${area}" fill="${color}" opacity="0.10"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${padL}" y="${padT-3}" fill="var(--dim)" font-size="9">${mx}${u}</text>
    <text x="${padL}" y="${(H-padB+3).toFixed(1)}" fill="var(--dim)" font-size="9">${mn}${u}</text>
    ${n>1?xlab(0,'start')+xlab(n-1,'end'):xlab(0,'middle')}
  </svg>`;
}

/* ============================ FUEL (NUTRITION) VIEW ============================
   Abs are revealed by fat loss + a strong core. This module gives concrete daily
   fuel targets: protein (from bodyweight), a calorie target (Mifflin-St Jeor
   calculator, moderate deficit), a hydration tracker, and a daily habit checklist
   with its own streak. All stored locally by date. */
const HABITS=[
  {k:'protein',label:'Hit protein target',emoji:'🥩'},
  {k:'cals',label:'Stayed in calorie deficit',emoji:'🔥'},
  {k:'water',label:'Hit water goal',emoji:'💧'},
  {k:'sleep',label:'7+ hours sleep',emoji:'😴'},
  {k:'steps',label:'Walk / 7k+ steps',emoji:'🚶'},
];
function nut(){return STATE.nutrition||(STATE.nutrition={goal:'lose',sex:null,age:null,heightCm:null,activity:1.45,kcalTarget:null,days:{}});}
function nutToday(){const n=nut();const d=todayISO();if(!n.days[d])n.days[d]={water:0,habits:{}};return n.days[d];}
function latestWeightKg(){
  const n=nut();
  if(n.weightKg>0)return n.weightKg;
  const ms=(STATE.measurements||[]).filter(m=>m.weight>0);
  if(ms.length){const w=ms[ms.length-1].weight;return STATE.profile.unit==='in'?w*0.453592:w;} // imperial logs lb
  return null;
}
function proteinTargetG(){const kg=latestWeightKg();if(!kg)return null;return Math.round(kg*1.8/5)*5;} // ~1.8 g/kg for fat loss
function waterTargetCups(){const kg=latestWeightKg();if(!kg)return 8;return clamp(Math.round(kg*35/240),6,16);} // ~35 ml/kg, 240 ml/cup
function nutritionStreak(){
  const n=nut();const dates=Object.keys(n.days).sort();let streak=0;
  for(let i=dates.length-1;i>=0;i--){const day=n.days[dates[i]];const hit=Object.values(day.habits||{}).filter(Boolean).length;
    if(hit>=4)streak++;else break;}
  return streak;
}
function renderFuel(){
  const v=$('#v-fuel');const n=nut();const t=nutToday();
  const kg=latestWeightKg();const prot=proteinTargetG();const wt=waterTargetCups();
  let h=`<h2 class="vtitle">Fuel</h2><div class="vsub">Abs are built in the gym and revealed in the kitchen. Hit these daily.</div>`;
  if(!kg){
    h+=`<div class="note warn">Add your <b>body weight</b> so we can set your protein &amp; calorie targets. <button class="btn sm primary" style="width:auto;margin-top:8px" onclick="logMeasure()">+ Log weight</button></div>`;
  }
  // goal toggle
  h+=`<div class="section-label">My goal</div><div class="daypick" style="margin:0 2px 14px">
    ${[['lose','🔥 Lose fat'],['recomp','⚖️ Tone up'],['maintain','💪 Maintain']].map(([g,l])=>`<button class="${n.goal===g?'on':''}" onclick="setNutGoal('${g}')">${l}</button>`).join('')}</div>`;
  // daily targets
  h+=`<div class="section-label">Today's targets</div><div class="grid2">
    <div class="stat"><div class="n" style="color:var(--fire-l)">${prot?prot+'g':'—'}</div><div class="l">Protein</div></div>
    <div class="stat"><div class="n" style="color:var(--gold)">${n.kcalTarget?n.kcalTarget:'—'}</div><div class="l">Calories${n.kcalTarget?'':' (set below)'}</div></div>
  </div>`;
  if(!n.kcalTarget){h+=`<div class="note info" style="margin-top:12px">${n.goal==='maintain'?'Eat around maintenance and let the training sculpt your core.':'For fat loss, eat in a <b>~300–500 kcal/day deficit</b> — enough to lean out, slow enough to keep your strength. Tap the calculator below for your exact number.'}</div>`;}
  // water tracker
  const wc=t.water||0;const wpct=Math.min(100,Math.round(wc/wt*100));
  h+=`<div class="section-label">Hydration</div><div class="card pad">
    <div class="row" style="justify-content:space-between"><div><b>${wc} / ${wt} cups</b><div class="tiny muted">≈ ${(wt*0.24).toFixed(1)} L goal · helps control appetite &amp; reveal definition</div></div>
      <div class="btnrow" style="flex:0 0 auto;gap:8px"><button class="btn sm ghost" onclick="logWater(-1)" style="width:44px">–</button><button class="btn sm primary" onclick="logWater(1)" style="width:44px">＋</button></div></div>
    <div class="pbar" style="margin-top:12px"><i style="width:${wpct}%;background:linear-gradient(90deg,#3fd7e8,#12b5c9)"></i></div>
  </div>`;
  // habit checklist
  const hitCount=Object.values(t.habits||{}).filter(Boolean).length;
  h+=`<div class="section-label">Daily habits · <span style="color:var(--green)">${hitCount}/${HABITS.length}</span> · 🔥 ${nutritionStreak()}-day streak</div><div class="card">
    ${HABITS.map(hb=>{const on=!!(t.habits&&t.habits[hb.k]);return `<button class="kv" style="width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);cursor:pointer;padding:13px 14px" onclick="toggleHabit('${hb.k}')">
      <span>${hb.emoji} ${hb.label}</span>
      <span class="ex-check" style="width:26px;height:26px;${on?'background:var(--green);border-color:var(--green)':''}"><svg viewBox="0 0 24 24" fill="none" stroke="#04220f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;opacity:${on?1:0}"><path d="M20 6 9 17l-5-5"/></svg></span></button>`;}).join('')}
  </div>`;
  // calorie calculator
  h+=`<div class="section-label">Calorie &amp; protein calculator</div><div class="card pad">
    <p class="sm muted" style="margin-top:0">Get your personal daily calorie target (Mifflin-St Jeor, moderate deficit) plus a protein goal.</p>
    <button class="btn primary" onclick="openTDEE()">${n.kcalTarget?'Update my targets':'Calculate my targets'}</button>
    ${n.kcalTarget?`<div class="tiny muted" style="margin-top:8px;text-align:center">Current target: <b>${n.kcalTarget} kcal</b> · ${prot||'—'}g protein · goal: ${n.goal}</div>`:''}
  </div>`;
  // abs-in-the-kitchen guidance
  h+=`<div class="section-label">Reveal your abs</div><div class="card pad">
    <ul class="cuelist" style="margin-top:2px">
      <li><b>Protein first</b> — ~1.6–2.2 g per kg keeps muscle while you lose fat and blunts hunger.</li>
      <li><b>Modest deficit</b> — aim to lose ~0.5–1% of bodyweight per week; faster costs muscle.</li>
      <li><b>Whole foods &amp; fibre</b> — veg, fruit, lean protein; they fill you up for fewer calories.</li>
      <li><b>Cut liquid calories</b> — sodas, juice, alcohol hide a deficit fast.</li>
      <li><b>Walk daily &amp; sleep 7–9h</b> — the quiet drivers of a shrinking waist.</li>
    </ul>
    <div class="note warn" style="margin-bottom:0">Spot-reduction isn't real: your core work builds the muscle, the deficit uncovers it. Track your <b>waist</b> weekly in Progress.</div>
  </div>`;
  v.innerHTML=h;
}
function setNutGoal(g){nut().goal=g;if(nut().kcalTarget)recalcKcalFromStored();save();renderFuel();}
function logWater(d){const t=nutToday();t.water=clamp((t.water||0)+d,0,20);if(t.water>=waterTargetCups()){if(!t.habits)t.habits={};t.habits.water=true;}save();renderFuel();checkAchievements();}
function toggleHabit(k){const t=nutToday();if(!t.habits)t.habits={};t.habits[k]=!t.habits[k];save();haptic(10);renderFuel();checkAchievements();}
function mifflinBMR(sex,kg,cm,age){return 10*kg+6.25*cm-5*age+(sex==='female'?-161:5);}
function recalcKcalFromStored(){
  const n=nut();if(!(n.sex&&n.age&&n.heightCm&&n.weightKg))return;
  const bmr=mifflinBMR(n.sex,n.weightKg,n.heightCm,n.age);const tdee=bmr*(n.activity||1.45);
  let t=n.goal==='maintain'?tdee:(n.goal==='recomp'?tdee*0.9:tdee*0.8);
  t=Math.max(t,bmr*1.1); // safety floor
  n.kcalTarget=Math.round(t/10)*10;
}
function openTDEE(){
  const n=nut();const imp=STATE.profile.unit==='in';
  openSheet(`
    <h3>Your calorie target</h3>
    <div class="field"><label>Sex (for the formula)</label>
      <div class="daypick"><button data-sx="male" class="${n.sex==='male'?'on':''}" onclick="tdeeSex('male',this)">Male</button><button data-sx="female" class="${n.sex==='female'?'on':''}" onclick="tdeeSex('female',this)">Female</button></div></div>
    <div class="field"><label>Age</label><input id="td-age" type="number" inputmode="numeric" value="${n.age||''}" placeholder="e.g. 35"></div>
    <div class="field"><label>Height (${imp?'in':'cm'})</label><input id="td-ht" type="number" inputmode="decimal" value="${n.heightCm?(imp?(n.heightCm/2.54).toFixed(0):n.heightCm):''}" placeholder="${imp?'e.g. 70':'e.g. 178'}"></div>
    <div class="field"><label>Weight (${imp?'lb':'kg'})</label><input id="td-wt" type="number" inputmode="decimal" value="${n.weightKg?(imp?(n.weightKg/0.453592).toFixed(0):n.weightKg):(latestWeightKg()?(imp?(latestWeightKg()/0.453592).toFixed(0):latestWeightKg().toFixed(0)):'')}" placeholder="${imp?'e.g. 185':'e.g. 84'}"></div>
    <div class="field"><label>Activity level</label>
      <select id="td-act" style="width:100%;padding:12px;border-radius:12px;background:var(--card2);color:var(--ink);border:1.5px solid var(--line);font-size:16px">
        <option value="1.2"${n.activity==1.2?' selected':''}>Mostly sitting</option>
        <option value="1.375"${n.activity==1.375?' selected':''}>Lightly active</option>
        <option value="1.45"${(!n.activity||n.activity==1.45)?' selected':''}>Moderately active</option>
        <option value="1.6"${n.activity==1.6?' selected':''}>Very active</option>
        <option value="1.75"${n.activity==1.75?' selected':''}>Extremely active</option>
      </select></div>
    <button class="btn primary" onclick="saveTDEE()">Calculate &amp; save</button>
  `);
}
function tdeeSex(s,btn){$$('#sheet [data-sx]').forEach(b=>b.classList.remove('on'));btn.classList.add('on');openTDEE._sex=s;}
function saveTDEE(){
  const n=nut();const imp=STATE.profile.unit==='in';
  const sex=openTDEE._sex||n.sex;const age=parseFloat($('#td-age').value);
  let ht=parseFloat($('#td-ht').value);let wt=parseFloat($('#td-wt').value);
  if(!(sex&&age>0&&ht>0&&wt>0)){toast('Fill in all fields');return;}
  if(imp){ht=ht*2.54;wt=wt*0.453592;}
  n.sex=sex;n.age=age;n.heightCm=Math.round(ht);n.weightKg=Math.round(wt*10)/10;n.activity=parseFloat($('#td-act').value)||1.45;
  recalcKcalFromStored();
  // also record the weight into measurements so waist/weight tracking stays in sync
  const today=todayISO();const disp=imp?Math.round(wt/0.453592):Math.round(wt);
  const ex=(STATE.measurements||[]).find(m=>m.date===today);
  if(ex){ex.weight=disp;}else{(STATE.measurements=STATE.measurements||[]).push({date:today,waist:null,weight:disp});}
  save();closeSheet();toast('Targets saved');renderFuel();
}

/* Roll up what was actually logged for a completed session. */
function sessionStats(p){
  const l=STATE.logs[p]||{ex:{}};const sess=buildSession(p);
  const items=[...sess.main,sess.finisher];
  const tempo=(typeof STATE.settings.repTempo==='number')?STATE.settings.repTempo:3;
  let exDone=0,setsDone=0,setsRx=0,totalReps=0,totalHold=0,estSec=0;
  items.forEach(m=>{
    const e=l.ex&&l.ex[m.exId];const sd=e&&e.sets?e.sets.filter(Boolean).length:0;
    setsDone+=sd;setsRx+=m.sets;if(e&&e.done)exDone++;
    if(m.unit==='time'){totalHold+=sd*m.target;estSec+=sd*m.target;}
    else{totalReps+=sd*m.target;estSec+=sd*m.target*tempo;}
    estSec+=Math.max(0,sd)*m.rest;                       // rest between sets
  });
  estSec+=(sess.warmup.length*35)+(sess.cooldown.length*33); // warm-up + cool-down
  return {sess,items,exDone,exTotal:items.length,setsDone,setsRx,totalReps,totalHold,estMin:Math.max(1,Math.round(estSec/60))};
}

  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='coreforge-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.version){toast('Not a CoreForge backup');return;}STATE=Object.assign(DEFAULT_STATE(),p);save();toast('Backup restored');render();}catch(err){toast('Could not read file');}};
  r.readAsText(f);
}
function hardReset(){
  if(!confirm('Erase ALL your data and start over? This cannot be undone.'))return;
  if(!confirm('Are you absolutely sure? Consider exporting a backup first.'))return;
  STATE=DEFAULT_STATE();save();go('today');
}

/* ============================ INSTALL PROMPT ============================ */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstallHint();});
function showInstallHint(){
  if(document.getElementById('installBanner'))return;
  if(!$('#v-today'))return;
}

/* ============================ BOOT ============================ */
async function boot(){
  await idbOpen();
  await load();
  // voice coach defaults for existing installs that predate these settings
  if(STATE.settings.voice===undefined)STATE.settings.voice=true;
  if(STATE.settings.voiceName===undefined)STATE.settings.voiceName='';
  if(typeof STATE.settings.voicePitch!=='number')STATE.settings.voicePitch=0.6;
  if(typeof STATE.settings.voiceRate!=='number')STATE.settings.voiceRate=0.98;
  if(typeof STATE.settings.repTempo!=='number')STATE.settings.repTempo=3;
  if(typeof STATE.adapt!=='number')STATE.adapt=1;   // adaptive-overload multiplier
  if(!STATE.nutrition||typeof STATE.nutrition!=='object')STATE.nutrition={goal:'lose',sex:null,age:null,heightCm:null,activity:1.45,kcalTarget:null,days:{}};
  if(!STATE.nutrition.days)STATE.nutrition.days={};
  if(!Array.isArray(STATE.photos))STATE.photos=[];
  if(!STATE.achievements||typeof STATE.achievements!=='object')STATE.achievements={};
  if(STATE.settings.reminderOn===undefined)STATE.settings.reminderOn=false;
  if(!STATE.settings.reminderTime)STATE.settings.reminderTime='18:00';
  if(STATE.settings.weeklyOn===undefined)STATE.settings.weeklyOn=true;
  if(!STATE.restDays||typeof STATE.restDays!=='object')STATE.restDays={};
  if(STATE.settings.hype===undefined)STATE.settings.hype=true;   // motivator on by default
  if(!STATE.settings.coach)STATE.settings.coach='auto';          // default persona
  // one-time: switch existing installs to the new rotating Auto coach
  if(!STATE.settings.autoIntro){STATE.settings.coach='auto';STATE.settings.autoIntro=true;}
  if(STATE.settings.beat===undefined)STATE.settings.beat=true;
  if(typeof STATE.settings.beatVol!=='number')STATE.settings.beatVol=0.55;
  if(!THEMES[STATE.settings.theme])STATE.settings.theme='ember';
  applyTheme(STATE.settings.theme);   // accent theme
  // request durable storage so an installed PWA keeps data
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  initBackButton();   // make the phone's Back button navigate instead of closing the app
  render();
  // voice coach: populate the voice list now and again when the OS finishes loading it,
  // and unlock speech on the first user interaction (mobile autoplay policy)
  try{loadCoachVoices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=loadCoachVoices;}catch(e){}
  document.addEventListener('pointerdown',primeVoice,{once:true,passive:true});
  try{checkReminder();}catch(e){}   // best-effort training-day nudge on open
  // service worker
  if('serviceWorker'in navigator){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
}
window.addEventListener('load',boot);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{checkReminder();}catch(e){}}});
</script>
