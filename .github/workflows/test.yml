name: Tests

# Runs on every push and every pull request. The deploy workflow waits on this,
# so nothing reaches a phone without the suite passing first.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:      # deploy-pages.yml calls this before publishing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The app has no runtime dependencies at all — Playwright is the only
      # devDependency, and it is what drives the real browser the suite needs.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Fast, and catches the class of breakage that would make every browser
      # test fail with the same unhelpful message.
      - name: Parse check and version lockstep
        run: npm run check

      - name: Run the suite
        run: npm test
