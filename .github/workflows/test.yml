name: Tests

# The deploy workflow waits on this, so nothing this repository publishes gets
# there without the suite passing first.

# There is deliberately no `push` trigger.
#
# On main, deploy-pages.yml calls this workflow before it publishes, so a push
# is already covered. Adding `push: [main]` on top meant the standalone run and
# the called run both resolved github.ref to refs/heads/main, landed in the same
# concurrency group, and cancel-in-progress made them kill each other — the
# deploy's test job was cancelled the instant it was created and the deploy
# itself was skipped. Every other branch is covered by pull_request.
on:
  pull_request:
  workflow_call:      # deploy-pages.yml calls this before publishing
  workflow_dispatch:

permissions:
  contents: read

# Keyed to the run, not the ref, so a called run can never contend with a
# standalone one for the same slot.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Four runners at once (v518). One runner took ~16 minutes; suite 23 alone is
  # ~7.5 of them, so it gets a runner of its own and the other 24 suites share
  # three. tests/lib/groups.mjs decides the split, and `npm run check` fails if
  # any suite lands in no group or two, or if this list stops matching the /4.
  test:
    name: test (group ${{ matrix.group }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false      # every group reports, so one red run names every failure
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The app has no runtime dependencies at all — Playwright is the only
      # devDependency, and it is what drives the real browser the suite needs.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Fast, and catches the class of breakage that would make every browser
      # test fail with the same unhelpful message.
      - name: Parse check and version lockstep
        run: npm run check

      - name: Run this group's suites
        run: npm test -- --group=${{ matrix.group }}/4

  # Runs only once every group has passed. It needs no browser.
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Since v517 the site is not the source tree: the published index.html has
      # every developer comment stripped (tools/build.mjs). The build proves it
      # changed nothing else and suite 25 drives the result. This job builds the
      # copy that is published and hands it to the deploy job. It is a separate
      # build from the one suite 25 drove, and that is safe for two reasons: the
      # build is deterministic (same source, the exact terser version
      # package.json pins, no options that vary), and verifyBuilt() runs on THIS build
      # too and throws rather than publish a copy that is not the same program.
      - name: Build the published copy
        run: node tools/build.mjs dist

      - name: Hand the published copy to the deploy job
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 1
