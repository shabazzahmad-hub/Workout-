name: Tests

# The deploy workflow waits on this, so nothing this repository publishes gets
# there without the suite passing first.

# There is deliberately no `push` trigger.
#
# On main, deploy-pages.yml calls this workflow before it publishes, so a push
# is already covered. Adding `push: [main]` on top meant the standalone run and
# the called run both resolved github.ref to refs/heads/main, landed in the same
# concurrency group, and cancel-in-progress made them kill each other — the
# deploy's test job was cancelled the instant it was created and the deploy
# itself was skipped. Every other branch is covered by pull_request.
on:
  pull_request:
  workflow_call:      # deploy-pages.yml calls this before publishing
  workflow_dispatch:

permissions:
  contents: read

# Keyed to the run, not the ref, so a called run can never contend with a
# standalone one for the same slot.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The app has no runtime dependencies at all — Playwright is the only
      # devDependency, and it is what drives the real browser the suite needs.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Fast, and catches the class of breakage that would make every browser
      # test fail with the same unhelpful message.
      - name: Parse check and version lockstep
        run: npm run check

      - name: Run the suite
        run: npm test
